server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: hrms-backend
    static_configs:
      - targets: [localhost]
        labels:
          job: hrms-backend
          service: api
          __path__: /var/log/hrms/backend-out.log

  - job_name: hrms-errors
    static_configs:
      - targets: [localhost]
        labels:
          job: hrms-backend
          service: api
          level: error
          __path__: /var/log/hrms/backend-err.log

  - job_name: hrms-workers
    static_configs:
      - targets: [localhost]
        labels:
          job: hrms-workers
          service: workers
          __path__: /var/log/hrms/workers-*.log
