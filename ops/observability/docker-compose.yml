# HRMS observability stack: GlitchTip (error tracking) + Uptime Kuma (uptime monitoring).
#
# Runs next to HRMS, never inside it. Nothing here touches the HRMS app, its MySQL or nginx.
# Ports bind to BIND_IP (default 127.0.0.1). Set BIND_IP to the server's LAN address to reach the
# UIs from the office network. Do NOT bind to 0.0.0.0 on a server with a public interface.
#
#   cp .env.example .env   # then run ./install.sh, which fills the secrets
#   docker compose up -d
#
# Versions are pinned. Upgrade deliberately: change the tag, run ./install.sh --upgrade.

name: hrms-observability

x-glitchtip-env: &glitchtip-env
  DATABASE_URL: postgres://glitchtip:${GT_DB_PASSWORD}@gt-postgres:5432/glitchtip
  REDIS_URL: redis://gt-valkey:6379/0
  SECRET_KEY: ${GT_SECRET_KEY}
  GLITCHTIP_DOMAIN: ${GT_PUBLIC_URL}
  DEFAULT_FROM_EMAIL: ${GT_FROM_EMAIL:-glitchtip@localhost}
  EMAIL_URL: ${GT_EMAIL_URL:-consolemail://}
  # Only the admin created by install.sh. Nobody can self-register.
  ENABLE_USER_REGISTRATION: "False"
  ENABLE_ORGANIZATION_CREATION: "False"
  # Error events are kept 30 days, then purged automatically.
  GLITCHTIP_MAX_EVENT_LIFE_DAYS: ${GT_EVENT_RETENTION_DAYS:-30}
  CELERY_WORKER_AUTOSCALE: "1,3"

services:
  gt-postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: glitchtip
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: ${GT_DB_PASSWORD}
    volumes:
      - gt-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitchtip -d glitchtip"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    networks: [obs]

  gt-valkey:
    image: valkey/valkey:8.1-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 192m
    networks: [obs]

  # One-shot: applies GlitchTip's database migrations, then exits. web/worker wait for it.
  gt-migrate:
    image: glitchtip/glitchtip:${GT_VERSION:-6.2.6}
    command: ["./manage.py", "migrate", "--noinput"]
    environment: *glitchtip-env
    depends_on:
      gt-postgres: { condition: service_healthy }
      gt-valkey: { condition: service_healthy }
    restart: "no"
    networks: [obs]

  gt-web:
    image: glitchtip/glitchtip:${GT_VERSION:-6.2.6}
    restart: unless-stopped
    environment: *glitchtip-env
    depends_on:
      gt-migrate: { condition: service_completed_successfully }
    ports:
      - "${BIND_IP:-127.0.0.1}:${GT_PORT:-8710}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/_health/')\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 768m
    networks: [obs]

  gt-worker:
    image: glitchtip/glitchtip:${GT_VERSION:-6.2.6}
    restart: unless-stopped
    command: ["./bin/run-celery-with-beat.sh"]
    environment: *glitchtip-env
    depends_on:
      gt-migrate: { condition: service_completed_successfully }
    mem_limit: 768m
    networks: [obs]

  uptime-kuma:
    image: louislam/uptime-kuma:${KUMA_VERSION:-2.5.6}
    restart: unless-stopped
    ports:
      - "${BIND_IP:-127.0.0.1}:${KUMA_PORT:-3001}:3001"
    volumes:
      - uptime-kuma:/app/data
    # Lets Uptime Kuma reach services on the host itself (HRMS API, MySQL) as host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 512m
    networks: [obs]

volumes:
  gt-postgres:
  uptime-kuma:

networks:
  obs:
