# nginx vhost for Keycloak HTTPS termination
# Installed by ops/keycloak/install.sh to /etc/nginx/sites-available/keycloak.conf
# TLS cert generated by install.sh at /etc/ssl/keycloak/

server {
    listen 192.168.11.225:8443 ssl;
    server_name 192.168.11.225;

    ssl_certificate     /etc/ssl/keycloak/cert.pem;
    ssl_certificate_key /etc/ssl/keycloak/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:KC:10m;
    ssl_session_timeout 5m;

    # Keycloak container is bound to 127.0.0.1:8180 — never exposed directly
    location / {
        proxy_pass         http://127.0.0.1:8180;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  https;
        proxy_read_timeout 300s;
        proxy_buffer_size  16k;
        proxy_buffers      8 16k;
    }
}
