name: PR59 Wire Canonical PnL Adapter

on:
  push:
    branches:
      - agent/deep-section-reports
    paths:
      - .github/workflows/pr59-wire-canonical-pnl.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pr59-wire-canonical-pnl.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-section-reports
          fetch-depth: 0

      - name: Wire canonical adapter
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/src/modules/reporting/bpo-master-report.service.ts')
          text = path.read_text()

          marker = 'import type { DeepReportPack, DeepReportSourceGroup } from "./deep-report-packs.js";'
          if marker in text:
            raise SystemExit('Unexpected stale deep-report import in BPO service')

          import_marker = '''import {
            BPO_MASTER_REPORTS,
            getBpoMasterReport,
            type BpoMasterColumn,
            type BpoMasterFormat,
          } from "./bpo-master-report-catalog.js";'''
          import_replacement = import_marker + '\nimport { runCanonicalBpoMasterAdapter } from "./bpo-master-canonical-adapters.js";'
          if text.count(import_marker) != 1:
            raise SystemExit(f'import marker mismatch: {text.count(import_marker)}')
          text = text.replace(import_marker, import_replacement, 1)

          run_marker = '''    const filters = normalizeFilters(inputFilters);
              const schema = await loadSchema();'''
          run_replacement = '''    const filters = normalizeFilters(inputFilters);
              const canonical = await runCanonicalBpoMasterAdapter(code, {
                month: filters.month,
                branchId: filters.branchId,
                processId: filters.processId,
                clientId: filters.clientId,
                limit: filters.limit,
                offset: filters.offset,
              });
              if (canonical) {
                const availableSet = new Set(canonical.availableKeys);
                const available = definition.columns
                  .filter((column) => availableSet.has(column.key))
                  .map((column) => column.key);
                const unavailable = definition.columns
                  .filter((column) => !availableSet.has(column.key))
                  .map((column) => column.key);
                return {
                  definition,
                  generatedAt: new Date().toISOString(),
                  sourceState: "available" as const,
                  sourceTable: canonical.sourceTable,
                  rows: canonical.rows,
                  totalCount: canonical.totalCount,
                  filters,
                  coverage: {
                    available,
                    unavailable,
                    percentage: definition.columns.length
                      ? Number(((available.length / definition.columns.length) * 100).toFixed(1))
                      : 100,
                  },
                  message: null,
                };
              }
              const schema = await loadSchema();'''
          if text.count(run_marker) != 1:
            raise SystemExit(f'run marker mismatch: {text.count(run_marker)}')
          path.write_text(text.replace(run_marker, run_replacement, 1))
          PY

          rm .github/workflows/pr59-wire-canonical-pnl.yml

      - name: Commit canonical adapter wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/modules/reporting/bpo-master-report.service.ts .github/workflows/pr59-wire-canonical-pnl.yml
          git commit -m "feat(reports): use canonical PnL engine for finance client and executive reports"
          git push origin HEAD:agent/deep-section-reports
