name: Ops Billing Legacy Import (manual)

# MAS Callnet I-Spark data HRMS does not have: provisions (provision_master) and collections
# (bill_pay_particulars) -> client_provision / client_receipt. db_bill is read with SELECT only.
# dry-run (default) writes nothing; apply needs confirm = import-mas-legacy. Idempotent on the
# I-Spark row id, so a re-run at cutover only adds what I-Spark recorded since.
on:
  workflow_dispatch:
    inputs:
      part:
        description: "provisions or collections"
        required: true
        default: "provisions"
        type: choice
        options: [provisions, collections]
      mode:
        description: "dry-run or apply"
        required: true
        default: "dry-run"
        type: choice
        options: [dry-run, apply]
      finance_year:
        description: "Provisions finance year"
        required: true
        default: "2026-27"
        type: string
      confirm:
        description: "Type import-mas-legacy to apply"
        required: false
        default: ""
        type: string

concurrency:
  group: ops-billing-legacy-import-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    name: Billing legacy import
    runs-on: self-hosted
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install backend deps
        working-directory: backend
        run: npm ci
      - name: Run
        working-directory: backend
        shell: bash
        env:
          DOTENV_CONFIG_PATH: /var/www/HRMS2/backend/.env
          NODE_ENV: production
          PART: ${{ inputs.part }}
          MODE: ${{ inputs.mode }}
          FINANCE_YEAR: ${{ inputs.finance_year }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          test -f "$DOTENV_CONFIG_PATH" || { echo "::error::$DOTENV_CONFIG_PATH not found"; exit 1; }
          npx tsx scripts/client-billing-import-legacy.ts
