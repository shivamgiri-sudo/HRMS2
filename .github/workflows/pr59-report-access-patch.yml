name: PR59 Report Access Patch

on:
  push:
    branches:
      - agent/deep-section-reports
    paths:
      - .github/workflows/pr59-report-access-patch.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pr59-report-access-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-section-reports
          fetch-depth: 0

      - name: Patch generic and high-risk report access
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          generic = Path('backend/src/modules/reporting/report-suite.routes.ts')
          text = generic.read_text()

          marker = 'import { resolveBranchScope } from "./reporting.scope.js";\n'
          replacement = (
            'import {\n'
            '  addScopedEmployeeFilters,\n'
            '  reportCatalogAccessMiddleware,\n'
            '  reportScopeMiddleware,\n'
            '} from "./reporting-access.js";\n'
          )
          if text.count(marker) != 1:
            raise SystemExit(f'Generic scope import mismatch: {text.count(marker)}')
          text = text.replace(marker, replacement, 1)

          helper_pattern = re.compile(
            r'function addEmployeeFilters\(query: any, clauses: string\[\], params: unknown\[\], alias = "e"\) \{[\s\S]*?\n\}\n',
            re.MULTILINE,
          )
          text, helper_count = helper_pattern.subn('', text, count=1)
          if helper_count != 1:
            raise SystemExit(f'Generic helper removal mismatch: {helper_count}')

          call_count = text.count('addEmployeeFilters(req.query,')
          if call_count < 5:
            raise SystemExit(f'Generic helper call count unexpectedly low: {call_count}')
          text = text.replace('addEmployeeFilters(req.query,', 'addScopedEmployeeFilters(req,')

          route_pattern = re.compile(
            r'reportSuiteRouter\.get\("/:code", requireRole\([\s\S]*?\), h\(async \(req, res\) => \{',
            re.MULTILINE,
          )
          text, route_count = route_pattern.subn(
            'reportSuiteRouter.get("/:code", reportScopeMiddleware, reportCatalogAccessMiddleware, h(async (req, res) => {',
            text,
            count=1,
          )
          if route_count != 1:
            raise SystemExit(f'Generic route middleware mismatch: {route_count}')

          old_scope_pattern = re.compile(
            r'\n\s*// Enforce branch scope: authenticated user must be within their authorized branch set\.[\s\S]*?\n\s*}\n\n\s*switch \(code\) \{',
            re.MULTILINE,
          )
          text, scope_count = old_scope_pattern.subn('\n\n  switch (code) {', text, count=1)
          if scope_count != 1:
            raise SystemExit(f'Old generic scope block mismatch: {scope_count}')
          generic.write_text(text)

          highrisk = Path('backend/src/modules/reporting/report-suite-highrisk.routes.ts')
          high = highrisk.read_text()

          old_import = 'import { requireRole } from "../../middleware/requireRole.js";\n'
          new_import = (
            'import {\n'
            '  addScopedEmployeeFilters,\n'
            '  reportCatalogAccessMiddleware,\n'
            '  reportScopeMiddleware,\n'
            '} from "./reporting-access.js";\n'
          )
          if high.count(old_import) != 1:
            raise SystemExit(f'High-risk access import mismatch: {high.count(old_import)}')
          high = high.replace(old_import, new_import, 1)

          use_marker = 'reportSuiteHighRiskRouter.use(requireAuth);\n'
          if high.count(use_marker) != 1:
            raise SystemExit(f'High-risk auth mount mismatch: {high.count(use_marker)}')
          high = high.replace(use_marker, use_marker + 'reportSuiteHighRiskRouter.use(reportScopeMiddleware);\n', 1)

          roles_pattern = re.compile(r'const roles = requireRole\([^\n]+\);')
          high, roles_count = roles_pattern.subn('const roles = reportCatalogAccessMiddleware;', high, count=1)
          if roles_count != 1:
            raise SystemExit(f'High-risk role gate mismatch: {roles_count}')

          high_helper_pattern = re.compile(
            r'function addEmployeeFilters\(query: any, clauses: string\[\], params: unknown\[\], alias = "e"\) \{[\s\S]*?\n\}\n',
            re.MULTILINE,
          )
          high, high_helper_count = high_helper_pattern.subn('', high, count=1)
          if high_helper_count != 1:
            raise SystemExit(f'High-risk helper removal mismatch: {high_helper_count}')

          high_call_count = high.count('addEmployeeFilters(req.query,')
          if high_call_count < 5:
            raise SystemExit(f'High-risk helper call count unexpectedly low: {high_call_count}')
          high = high.replace('addEmployeeFilters(req.query,', 'addScopedEmployeeFilters(req,')
          highrisk.write_text(high)
          PY

          rm .github/workflows/pr59-report-access-patch.yml

      - name: Commit access enforcement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/modules/reporting/report-suite.routes.ts \
                  backend/src/modules/reporting/report-suite-highrisk.routes.ts \
                  .github/workflows/pr59-report-access-patch.yml
          git commit -m "fix(reports): enforce report RBAC and branch scope on drill-downs"
          git push origin HEAD:agent/deep-section-reports
