name: Ops Verify Branch RBAC (manual, read-only)

# One-off, read-only check that the branch-scoping rollout's migrations and process codes are present in the
# live database. Runs SELECTs only (backend/scripts/verify-branch-rbac.mjs) on the self-hosted production
# runner using the deployed .env, so no credential changes hands. workflow_dispatch only; writes nothing.

on:
  workflow_dispatch: {}

concurrency:
  group: ops-verify-branch-rbac-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify branch RBAC rows
    runs-on: self-hosted
    environment: production
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Run read-only verification
        working-directory: backend
        shell: bash
        env:
          DOTENV_CONFIG_PATH: /var/www/HRMS2/backend/.env
          NODE_ENV: production
        run: |
          set -euo pipefail
          test -f "$DOTENV_CONFIG_PATH" || { echo "::error::$DOTENV_CONFIG_PATH not found"; exit 1; }
          node scripts/verify-branch-rbac.mjs
