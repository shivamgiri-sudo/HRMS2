name: Apply Migration 200 Bank Detail Prerequisite

on:
  pull_request:
    paths:
      - ".github/workflows/engagement-gamification-fresh-schema.yml"
  push:
    branches:
      - codex/performance-staging-certification
    paths:
      - ".github/workflows/engagement-gamification-fresh-schema.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Bootstrap candidate onboarding bank details
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('backend/sql/200_onboarding_empcode_bgv_gaps.sql')
          text = path.read_text(encoding='utf-8')
          marker = '-- ── 4. Add missing candidate onboarding profile fields'
          if marker not in text:
              raise SystemExit('candidate profile section marker missing')
          bootstrap = '''-- ── 3B. Candidate onboarding bank-detail base table ─────────────────────────
          -- Earlier rollout code expected this table but no canonical migration created
          -- it. Define the stable candidate/account/proof fields before the validation
          -- procedure below adds reviewer evidence and decision status.
          CREATE TABLE IF NOT EXISTS candidate_onboarding_bank_detail (
            id CHAR(36) NOT NULL DEFAULT (UUID()) PRIMARY KEY,
            candidate_id CHAR(36) NOT NULL,
            account_holder_name VARCHAR(255) NULL,
            bank_name VARCHAR(255) NULL,
            bank_branch VARCHAR(255) NULL,
            account_number VARCHAR(100) NULL,
            ifsc_code VARCHAR(20) NULL,
            account_type ENUM('savings','current','salary','other') NULL,
            cancelled_cheque_url VARCHAR(500) NULL,
            bank_proof_url VARCHAR(500) NULL,
            created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,
            updated_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
            UNIQUE KEY uq_candidate_onboarding_bank (candidate_id),
            INDEX idx_candidate_onboarding_bank_ifsc (ifsc_code),
            FOREIGN KEY (candidate_id) REFERENCES ats_candidate(id) ON DELETE CASCADE
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;

          '''
          if '3B. Candidate onboarding bank-detail base table' not in text:
              text = text.replace(marker, bootstrap + marker, 1)
          if 'CREATE TABLE IF NOT EXISTS candidate_onboarding_bank_detail' not in text:
              raise SystemExit('bank-detail base table was not inserted')
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/sql/200_onboarding_empcode_bgv_gaps.sql
          git commit -m "fix(migrations): bootstrap candidate bank details"
          target_branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git push origin HEAD:"$target_branch"
