name: Apply Migration 199 Cost Centre Repair

on:
  pull_request:
    paths:
      - ".github/workflows/engagement-gamification-fresh-schema.yml"
  push:
    branches:
      - codex/performance-staging-certification
    paths:
      - ".github/workflows/engagement-gamification-fresh-schema.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Replace stale employee cost-centre column
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('backend/sql/199_process_branch_dept_cleanup.sql')
          text = path.read_text(encoding='utf-8')
          before = text.count('cost_center_code')
          if before != 6:
              raise SystemExit(f'expected 6 cost_center_code references including comments, found {before}')
          text = text.replace('cost_center_code', 'cost_center')
          if 'cost_center_code' in text:
              raise SystemExit('stale cost_center_code reference remains')
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/sql/199_process_branch_dept_cleanup.sql
          if git diff --cached --quiet; then
            echo "Migration 199 already uses canonical cost_center"
            exit 0
          fi
          git commit -m "fix(migrations): use canonical employee cost centre field"
          target_branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git push origin HEAD:"$target_branch"
