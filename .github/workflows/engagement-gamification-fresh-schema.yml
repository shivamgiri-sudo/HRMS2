name: Apply Migration 200 Employee Sequence Repair

on:
  pull_request:
    paths:
      - ".github/workflows/engagement-gamification-fresh-schema.yml"
  push:
    branches:
      - codex/performance-staging-certification
    paths:
      - ".github/workflows/engagement-gamification-fresh-schema.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Reconcile migration 200 employee sequence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('backend/sql/200_onboarding_empcode_bgv_gaps.sql')
          text = path.read_text(encoding='utf-8')
          old = '''  -- Ensure the 4 rows exist, then sync all to global_max
          INSERT INTO employee_code_sequence (company_prefix, is_offrole, current_sequence)
          VALUES
            ('MAS', FALSE, v_global_max),
            ('MAS', TRUE,  v_global_max),
            ('IDC', FALSE, v_global_max),
            ('IDC', TRUE,  v_global_max)
          ON DUPLICATE KEY UPDATE
            current_sequence = GREATEST(current_sequence, v_global_max);'''
          new = '''  -- Migration 138 owns one sequence row per company prefix. On-roll and
          -- off-role codes share the same numeric counter, so both prefixes advance to
          -- the global maximum observed across all four employee-code formats.
          INSERT INTO employee_code_sequence (company_prefix, last_sequence_number)
          VALUES
            ('MAS', v_global_max),
            ('IDC', v_global_max)
          ON DUPLICATE KEY UPDATE
            last_sequence_number = GREATEST(last_sequence_number, v_global_max);'''
          if old not in text:
              raise SystemExit('legacy sequence block not found exactly once')
          text = text.replace(old, new, 1)
          for token in ('is_offrole', 'current_sequence'):
              if token in text:
                  raise SystemExit(f'legacy employee sequence token remains: {token}')
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/sql/200_onboarding_empcode_bgv_gaps.sql
          git commit -m "fix(migrations): reconcile employee code sequence"
          target_branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git push origin HEAD:"$target_branch"
