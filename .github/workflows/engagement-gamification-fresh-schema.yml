name: Apply Migration 200 Employee Sequence Repair

on:
  pull_request:
    paths:
      - ".github/workflows/engagement-gamification-fresh-schema.yml"
  push:
    branches:
      - codex/performance-staging-certification
    paths:
      - ".github/workflows/engagement-gamification-fresh-schema.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Reconcile migration 200 employee sequence
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('backend/sql/200_onboarding_empcode_bgv_gaps.sql')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r"\s*-- Ensure the 4 rows exist, then sync all to global_max\s+"
              r"INSERT INTO employee_code_sequence\s*\(company_prefix,\s*is_offrole,\s*current_sequence\)\s*"
              r"VALUES\s*"
              r"\('MAS',\s*FALSE,\s*v_global_max\),\s*"
              r"\('MAS',\s*TRUE,\s*v_global_max\),\s*"
              r"\('IDC',\s*FALSE,\s*v_global_max\),\s*"
              r"\('IDC',\s*TRUE,\s*v_global_max\)\s*"
              r"ON DUPLICATE KEY UPDATE\s*"
              r"current_sequence\s*=\s*GREATEST\(current_sequence,\s*v_global_max\);",
              re.S,
          )
          replacement = """
            -- Migration 138 owns one sequence row per company prefix. On-roll and
            -- off-role codes share the same numeric counter, so both prefixes advance to
            -- the global maximum observed across all four employee-code formats.
            INSERT INTO employee_code_sequence (company_prefix, last_sequence_number)
            VALUES
              ('MAS', v_global_max),
              ('IDC', v_global_max)
            ON DUPLICATE KEY UPDATE
              last_sequence_number = GREATEST(last_sequence_number, v_global_max);"""
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one legacy sequence INSERT, replaced {count}')
          procedure_start = text.index('CREATE PROCEDURE _sync_emp_code_seq()')
          procedure_end = text.index('DROP PROCEDURE IF EXISTS _sync_emp_code_seq;', procedure_start)
          procedure = text[procedure_start:procedure_end]
          for token in ('is_offrole', 'current_sequence'):
              if token in procedure:
                  raise SystemExit(f'legacy sequence token remains inside procedure: {token}')
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/sql/200_onboarding_empcode_bgv_gaps.sql
          git commit -m "fix(migrations): reconcile employee code sequence"
          target_branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git push origin HEAD:"$target_branch"
