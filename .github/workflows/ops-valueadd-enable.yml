# Turns one Hiring Engine value-add switch on or off in backend/.env (HE_SHOWRATE_CALIBRATION: the daily plan sizes invitations from the
# MEASURED show-up rate instead of the 25% default). Changes on 192.168.11.225: backend/.env (a backup is kept next to it), then restarts
# hrms2-backend and hrms2-workers. Only the whitelisted keys can be set; the value must be exactly true or false.

name: Ops value-add switch (enable/disable)

on:
  workflow_dispatch:
    inputs:
      key:
        description: "Which switch"
        required: true
        type: choice
        default: HE_SHOWRATE_CALIBRATION
        options: [HE_SHOWRATE_CALIBRATION, HE_SMART_SLOTS, HE_ACTION_QUEUE, HE_OUTCOME_REASONS, HE_COST_PER_SOURCE, HE_BEST_OFFER]
      value:
        description: "true or false"
        required: true
        type: choice
        default: "true"
        options: ["true", "false"]

concurrency:
  group: ops-valueadd-flag
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  flag:
    name: Set switch on 192.168.11.225
    runs-on: self-hosted
    environment: production
    timeout-minutes: 10
    steps:
      - name: Set .env and restart
        shell: bash
        env:
          KEY: ${{ inputs.key }}
          VALUE: ${{ inputs.value }}
        run: |
          set -euo pipefail
          [[ "$KEY" =~ ^HE_(SHOWRATE_CALIBRATION|SMART_SLOTS|ACTION_QUEUE|OUTCOME_REASONS|COST_PER_SOURCE|BEST_OFFER)$ ]] || { echo "::error::key not allowed"; exit 1; }
          [[ "$VALUE" == "true" || "$VALUE" == "false" ]] || { echo "::error::value must be true or false"; exit 1; }
          ENV_FILE="/var/www/HRMS2/backend/.env"
          test -f "$ENV_FILE" || { echo "::error::$ENV_FILE not found."; exit 1; }
          BACKUP="${ENV_FILE}.bak-valueadd-$(date -u +%Y%m%dT%H%M%SZ)"
          cp -a "$ENV_FILE" "$BACKUP"; echo "Backed up to $BACKUP"
          if [[ -s "$ENV_FILE" && -n "$(tail -c 1 "$ENV_FILE")" ]]; then printf '\n' >> "$ENV_FILE"; fi
          sed -i -E "/^${KEY}=/d" "$ENV_FILE"
          printf '%s=%s\n' "$KEY" "$VALUE" >> "$ENV_FILE"
          [[ "$(grep -cE "^${KEY}=" "$ENV_FILE")" == "1" ]] || { echo "::error::$KEY not exactly once; restoring"; cp -a "$BACKUP" "$ENV_FILE"; exit 1; }
          grep -E "^${KEY}=" "$ENV_FILE"
          pm2 restart hrms2-backend hrms2-workers --update-env --no-color
          pm2 save --no-color
          pm2 status --no-color
