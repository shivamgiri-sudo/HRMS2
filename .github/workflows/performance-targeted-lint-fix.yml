name: Performance Targeted Lint Fix

on:
  push:
    branches:
      - agent/performance-ingestion-platform
    paths:
      - .github/workflows/performance-targeted-lint-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/performance-ingestion-platform
          fetch-depth: 0

      - name: Apply only the two reviewed source edits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python - <<'PY'
          from pathlib import Path

          ingestion = Path('backend/src/modules/performance-ingestion/performance-ingestion.service.ts')
          text = ingestion.read_text()
          old = r"const dmy = raw.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);"
          new = r"const dmy = raw.match(/^(\d{1,2})[/-](\d{1,2})[/-](\d{4})$/);"
          if old not in text:
              raise SystemExit('Expected ingestion date regex was not found')
          ingestion.write_text(text.replace(old, new, 1))

          migrations = Path('backend/src/db/runPendingMigrations.ts')
          text = migrations.read_text()
          old = 'let verificationState: SchemaVerificationState = {'
          new = 'const verificationState: SchemaVerificationState = {'
          if old not in text:
              raise SystemExit('Expected verificationState declaration was not found')
          migrations.write_text(text.replace(old, new, 1))
          PY

          git add \
            backend/src/modules/performance-ingestion/performance-ingestion.service.ts \
            backend/src/db/runPendingMigrations.ts
          git rm .github/workflows/performance-targeted-lint-fix.yml
          git commit -m "fix(performance): resolve changed-file lint errors"
          git push origin HEAD:agent/performance-ingestion-platform
