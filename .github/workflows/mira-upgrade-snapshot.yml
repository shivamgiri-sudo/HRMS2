name: Apply Mira Upgrade

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/mira-upgrade-snapshot.yml"
  push:
    branches:
      - agent/mira-openrouter-company-voice
    paths:
      - ".github/workflows/mira-upgrade-snapshot.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mira-openrouter-company-voice
          fetch-depth: 0
      - name: Verify and apply staged application sources
        shell: bash
        run: |
          set -euo pipefail
          {
            head -c 11000 .mira-patch/part-00
            cat .mira-patch/part-01 .mira-patch/part-02 .mira-patch/part-03 .mira-patch/part-04 .mira-patch/part-05 .mira-patch/part-06 .mira-patch/part-07
          } > /tmp/mira-patch.b64
          test "$(wc -c < /tmp/mira-patch.b64)" -eq 64692
          echo "10f6aac7658d0fe428d749282f388d5f25cc06c1e0ba936d6bbf29c07c2563a0  /tmp/mira-patch.b64" | sha256sum -c -
          base64 -d /tmp/mira-patch.b64 > /tmp/mira-patch.tar.gz
          echo "d407fb4adbbbeb1b81ad3423ad65b30b8b145ccf6984a0f0c429de33536d6b03  /tmp/mira-patch.tar.gz" | sha256sum -c -
          gzip -t /tmp/mira-patch.tar.gz
          test "$(tar -tzf /tmp/mira-patch.tar.gz | grep -vc '/$')" -eq 17
          tar -xzf /tmp/mira-patch.tar.gz
          rm -f .github/workflows/mira-upgrade-validation.yml
          git rm .mira-patch/part-00 .mira-patch/part-01 .mira-patch/part-02 .mira-patch/part-03 .mira-patch/part-04 .mira-patch/part-05 .mira-patch/part-06 .mira-patch/part-07
          git add -- backend/sql/000_ai_supplemental.sql backend/sql/425_mira_openrouter_company_knowledge.sql backend/src/db/runFinanceSupplementalMigrations.ts backend/src/modules/ai/__tests__/ai-mira-security.test.ts backend/src/modules/ai/__tests__/ai-mira-upgrade-migration.test.ts backend/src/modules/ai/__tests__/ai-mira-upgrade.test.ts backend/src/modules/ai/ai-account.service.ts backend/src/modules/ai/ai-company-knowledge.service.ts backend/src/modules/ai/ai-insights.routes.ts backend/src/modules/ai/ai-provider-config.service.ts backend/src/modules/ai/ai-provider.registry.ts backend/src/modules/ai/providers/openrouter.provider.ts src/components/ai/CommandPalette.tsx src/hooks/useMiraVoice.ts src/pages/AIProviderSettings.tsx src/pages/PeopleOSCopilot.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --check
          git commit -m "feat(ai): ground Mira in live HRMS and company knowledge"
          git push origin HEAD:agent/mira-openrouter-company-voice
