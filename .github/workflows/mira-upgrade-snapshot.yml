name: Apply Mira Upgrade

on:
  push:
    branches:
      - agent/mira-openrouter-company-voice
    paths:
      - ".github/workflows/mira-upgrade-snapshot.yml"

permissions:
  contents: write

concurrency:
  group: apply-mira-upgrade
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mira-openrouter-company-voice
          fetch-depth: 0

      - name: Verify and apply staged source payload
        shell: bash
        run: |
          set -euo pipefail
          cat .mira-patch/part-* > /tmp/mira-patch.b64
          test "$(wc -c < /tmp/mira-patch.b64)" -eq 64692
          base64 -d /tmp/mira-patch.b64 > /tmp/mira-patch.tar.gz
          echo "d407fb4a30254f046b6307ae758b19cdd9089c264a6a4855406e7924669d6b03  /tmp/mira-patch.tar.gz" | sha256sum -c -
          gzip -t /tmp/mira-patch.tar.gz
          tar -tzf /tmp/mira-patch.tar.gz > /tmp/mira-patch-files.txt
          test "$(wc -l < /tmp/mira-patch-files.txt)" -eq 17
          tar -xzf /tmp/mira-patch.tar.gz
          rm -rf .mira-patch
          git rm .github/workflows/mira-upgrade-snapshot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(ai): ground Mira in live HRMS and company knowledge"
          git push origin HEAD:agent/mira-openrouter-company-voice
