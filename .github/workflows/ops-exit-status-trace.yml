name: Ops Exit Status Trace (manual, read-only)

# Shows one employee's exit requests and who moved them to which status (exit_approval_log, audit logs). Writes nothing.

on:
  workflow_dispatch:
    inputs:
      employee_code:
        description: 'Employee code, e.g. MAS63669'
        required: true
        type: string

concurrency:
  group: ops-exit-status-trace-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  stats:
    runs-on: self-hosted
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install backend deps
        working-directory: backend
        run: npm ci
      - name: Stats
        working-directory: backend
        env:
          DOTENV_CONFIG_PATH: /var/www/HRMS2/backend/.env
          NODE_ENV: production
          EMP_CODE: ${{ inputs.employee_code }}
        run: node scripts/exit-status-trace.mjs "$EMP_CODE"
