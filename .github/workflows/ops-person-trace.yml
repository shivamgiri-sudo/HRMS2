name: Ops person trace by e-mail (manual, read-only)

# Read-only: one person's lead, form fill, address, follow-up rows, bookings and messages, found by e-mail. Writes nothing.
on:
  workflow_dispatch:
    inputs:
      email:
        description: "The person's e-mail address"
        required: true

concurrency:
  group: ops-person-trace
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  trace:
    name: Person trace
    runs-on: self-hosted
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install backend deps
        working-directory: backend
        run: npm ci
      - name: Trace (read-only)
        working-directory: backend
        shell: bash
        env:
          DOTENV_CONFIG_PATH: /var/www/HRMS2/backend/.env
          NODE_ENV: production
          PERSON_EMAIL: ${{ inputs.email }}
        run: |
          set -euo pipefail
          test -f "$DOTENV_CONFIG_PATH" || { echo "::error::production .env not found"; exit 1; }
          npx tsx scripts/person-trace.ts
