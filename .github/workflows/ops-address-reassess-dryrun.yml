name: Ops Address Reassess (manual; dry-run unless apply=APPLY)

# Applies the two-signal address assessment to the submissions waiting for HR and prints the outcome counts.
# Dry-run writes nothing. With apply=APPLY it marks ONLY the auto-verifiable submissions verified.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Type APPLY to mark the auto-verifiable submissions verified (writes). Anything else = dry-run.'
        required: false
        default: ''

concurrency:
  group: ops-address-reassess-dryrun-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  stats:
    runs-on: self-hosted
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install backend deps
        working-directory: backend
        run: npm ci
      - name: Stats
        working-directory: backend
        env:
          DOTENV_CONFIG_PATH: /var/www/HRMS2/backend/.env
          NODE_ENV: production
          APPLY: ${{ github.event.inputs.apply == 'APPLY' && '1' || '0' }}
        run: npx tsx scripts/address-reassess-dryrun.ts
