name: Ops billing schema verify (manual, read-only)

# Read-only: confirms the client-billing migrations applied on production (schema_migrations rows,
# new columns / tables / unique indexes) and counts a few governance states. Writes nothing.
on:
  workflow_dispatch: {}

concurrency:
  group: ops-billing-schema-verify
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Billing schema verify
    runs-on: self-hosted
    environment: production
    timeout-minutes: 5
    steps:
      - name: Verify
        shell: bash
        working-directory: /var/www/HRMS2/backend
        run: |
          node --input-type=module -e '
            import "dotenv/config";
            import mysql from "mysql2/promise";
            const c = await mysql.createConnection({ host: process.env.DB_HOST, port: Number(process.env.DB_PORT || 3306), user: process.env.DB_USER, password: process.env.DB_PASSWORD, database: process.env.DB_NAME, connectTimeout: 10000 });
            const q = async (label, sql, p = []) => { try { const [r] = await c.query(sql, p); console.log("### " + label); console.table(r); } catch (e) { console.log("### " + label + " FAILED: " + e.message); } };
            const [cols] = await c.query("SHOW COLUMNS FROM schema_migrations");
            const nameCol = cols.map((x) => x.Field).find((f) => /name|file|migration|version/i.test(f)) || cols[0].Field;
            console.log("schema_migrations columns:", cols.map((x) => x.Field).join(", "));
            await q("migrations 2196-2212", `SELECT * FROM schema_migrations WHERE ${nameCol} REGEXP "(2196|2197|2198|2205|2206|2210|2211|2212|2214|2216)_" ORDER BY ${nameCol}`);
            await q("2216 branch_health_snapshot table", `SELECT COUNT(*) AS cols FROM information_schema.COLUMNS WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = "branch_health_snapshot"`);
            await q("2214 cost_centre_process_link rows", `SELECT cc.cost_centre_code, p.process_code, l.relation, l.share_pct, l.active_status, l.evidence FROM cost_centre_process_link l JOIN cost_centre_master cc ON cc.id = l.cost_centre_id JOIN process_master p ON p.id = l.process_id ORDER BY cc.cost_centre_code, p.process_code`);
            await q("new columns", `SELECT TABLE_NAME, COLUMN_NAME FROM information_schema.COLUMNS WHERE TABLE_SCHEMA = DATABASE() AND ((TABLE_NAME = "client_po_number" AND COLUMN_NAME IN ("attachment_path","approval_status","approved_amount")) OR (TABLE_NAME = "client_invoice_line" AND COLUMN_NAME = "line_no") OR (TABLE_NAME = "client_invoice" AND COLUMN_NAME IN ("approved_by","approved_at","due_date")) OR (TABLE_NAME = "client_credit_note" AND COLUMN_NAME IN ("rejected_by","rejected_reason")) OR (TABLE_NAME = "client_provision" AND COLUMN_NAME IN ("rejected_by","legacy_source_id"))) ORDER BY 1, 2`);
            await q("new tables", `SELECT TABLE_NAME FROM information_schema.TABLES WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME IN ("client_po_line","client_po_audit","client_credit_note_audit","client_provision_audit","client_receipt","client_receipt_allocation","tally_legacy_name") ORDER BY 1`);
            await q("unique indexes (2212)", `SELECT TABLE_NAME, INDEX_NAME, NON_UNIQUE FROM information_schema.STATISTICS WHERE TABLE_SCHEMA = DATABASE() AND INDEX_NAME IN ("uq_ccn_credit_no","uq_ci_proforma_no")`);
            await q("credit_status enum", `SELECT COLUMN_TYPE FROM information_schema.COLUMNS WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = "client_credit_note" AND COLUMN_NAME = "credit_status"`);
            await q("PO approval states", `SELECT approval_status, COUNT(*) n FROM client_po_number GROUP BY approval_status`);
            await q("counter scope keys (normalised)", `SELECT kind, scope_key, last_value FROM client_invoice_number_sequence WHERE scope_key REGEXP "mascallnet|MAS" ORDER BY kind, scope_key LIMIT 20`);
            await c.end();
          '
