name: Ops link Meta ad campaigns (manual)

# Links three HRMS campaigns to their Meta ad campaigns (owner-approved), marks Ahmedabad DRA active and runs the spend sync once.
# Dry run unless "apply" is true.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "true to write, anything else is a dry run"
        required: false
        default: "false"

concurrency:
  group: ops-meta-campaign-link-apply
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  link:
    name: Link Meta campaigns
    runs-on: self-hosted
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install backend deps
        working-directory: backend
        run: npm ci
      - name: Link (dry run unless apply)
        working-directory: backend
        shell: bash
        env:
          DOTENV_CONFIG_PATH: /var/www/HRMS2/backend/.env
          NODE_ENV: production
          APPLY: ${{ inputs.apply == 'true' && '1' || '0' }}
        run: |
          set -euo pipefail
          test -f "$DOTENV_CONFIG_PATH" || { echo "::error::production .env not found"; exit 1; }
          npx tsx scripts/meta-campaign-link-apply.ts
