name: Typing Scoring One-Time Fix

on:
  push:
    branches:
      - fix/typing-test-scoring-accuracy
    paths:
      - .github/workflows/typing-scoring-one-time-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/typing-test-scoring-accuracy
          fetch-depth: 0

      - name: Apply guarded integration patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Backend timing, pass-first attempt ranking and audit evidence.
          service = Path('backend/src/modules/ats-assessment/assessment.service.ts')
          text = service.read_text()

          old = '''    const actualElapsed = Math.max(1, Math.floor((Date.now() - started) / 1000));
    const elapsed = Math.min(actualElapsed, Number(typing.duration_limit_seconds) + TYPING_GRACE_SECONDS);
    const scored = calculateTypingScore({'''
          new = '''    const actualElapsed = Math.max(1, Math.floor((Date.now() - started) / 1000));
    const durationLimitSeconds = Number(typing.duration_limit_seconds);
    // The grace window permits a delayed network submission; it must not be
    // counted as typing time because doing so unfairly lowers WPM.
    const elapsed = Math.min(actualElapsed, durationLimitSeconds);
    const scored = calculateTypingScore({'''
          if text.count(old) != 1:
              raise SystemExit(f'service elapsed block mismatch: {text.count(old)}')
          text = text.replace(old, new, 1)

          marker = '''      minAccuracy: definition.typing.minAccuracy,
    });
    const pasteAttempts'''
          replacement = '''      minAccuracy: definition.typing.minAccuracy,
    });
    // Prevent a candidate from submitting a tiny perfect sample to obtain an
    // inflated WPM/accuracy result. Before the configured timer ends, the
    // complete fixed passage must have been attempted.
    if (actualElapsed < durationLimitSeconds && scored.completionPercentage < 100) {
      throw appError(
        "Continue typing the complete passage or wait until the typing timer ends",
        400,
        "TYPING_SAMPLE_INCOMPLETE",
      );
    }
    const pasteAttempts'''
          if text.count(marker) != 1:
              raise SystemExit(f'service scoring marker mismatch: {text.count(marker)}')
          text = text.replace(marker, replacement, 1)

          order_old = 'ORDER BY score_percentage DESC, attempt_no ASC'
          order_new = 'ORDER BY passed_benchmark DESC, score_percentage DESC, accuracy_percentage DESC, net_wpm DESC, attempt_no ASC'
          order_count = text.count(order_old)
          if order_count < 2:
              raise SystemExit(f'expected at least two typing attempt ordering clauses, found {order_count}')
          text = text.replace(order_old, order_new)

          audit_old = '''        netWpm: scored.netWpm,
        accuracy: scored.accuracy,
        pasteAttempts,'''
          audit_new = '''        grossWpm: scored.grossWpm,
        netWpm: scored.netWpm,
        accuracy: scored.accuracy,
        completionPercentage: scored.completionPercentage,
        scoringVersion: scored.scoringVersion,
        pasteAttempts,'''
          if text.count(audit_old) != 1:
              raise SystemExit(f'service audit block mismatch: {text.count(audit_old)}')
          text = text.replace(audit_old, audit_new, 1)
          service.write_text(text)

          # Accuracy benchmarks: standard data-entry 95%; critical document
          # assessment 98%; QA review roles 97% outside the document process.
          catalog = Path('backend/src/modules/ats-assessment/assessment.catalog.ts')
          text = catalog.read_text()
          old = '''const typingFor = (process: AssessmentProcess, role: AssessmentRole): TypingDefinition => ({
  required: ["backoffice", "document", "email"].includes(process),
  durationSeconds: 180,
  minNetWpm: role === "team_leader" ? 35 : role === "quality_auditor" ? 32 : 30,
  minAccuracy: role === "executive" ? 92 : 95,
  maxAttempts: 2,
  passage: PASSAGES[process],
});'''
          new = '''const typingFor = (process: AssessmentProcess, role: AssessmentRole): TypingDefinition => ({
  required: ["backoffice", "document", "email"].includes(process),
  durationSeconds: 180,
  minNetWpm: role === "team_leader" ? 35 : role === "quality_auditor" ? 32 : 30,
  minAccuracy: process === "document" ? 98 : role === "quality_auditor" ? 97 : 95,
  maxAttempts: 2,
  passage: PASSAGES[process],
});'''
          if text.count(old) != 1:
              raise SystemExit(f'catalog typingFor block mismatch: {text.count(old)}')
          catalog.write_text(text.replace(old, new, 1))

          # Candidate live metrics must use attempted-text accuracy, matching the
          # authoritative backend model without exposing correction positions.
          page = Path('backend/src/modules/ats-assessment/assessment.page.ts')
          text = page.read_text()
          old = '''function levenshtein(left,right){const a=Array.from(left),b=Array.from(right);let previous=Array.from({length:b.length+1},(_,index)=>index);for(let row=1;row<=a.length;row++){const current=[row];for(let column=1;column<=b.length;column++){current[column]=Math.min(current[column-1]+1,previous[column]+1,previous[column-1]+(a[row-1]===b[column-1]?0:1))}previous=current}return previous[b.length]}
function liveMetrics(){if(!typingState||!$("typingInput"))return;const text=$("typingInput").value;const started=new Date(typingState.startedAt).getTime();const elapsed=Math.max(1,Math.floor((Date.now()-started)/1000));const gross=(Array.from(text).length/5)/(elapsed/60);const distance=levenshtein(typingState.passage,text);const denominator=Math.max(Array.from(typingState.passage).length,Array.from(text).length,1);const accuracy=Math.max(0,(denominator-distance)/denominator*100);$("typingElapsed").textContent=formatTime(elapsed);$("typingWpm").textContent=gross.toFixed(1);$("typingAccuracy").textContent=accuracy.toFixed(1)+"%";$("typingCharacters").textContent=Array.from(text).length;const remaining=Number(typingState.durationSeconds)-elapsed;$("typingRemaining").textContent=formatTime(remaining);if(remaining<=0)submitTyping(true)}'''
          new = '''function attemptedTypingMetrics(reference,typed){const a=Array.from(String(reference??"").replace(/\\r\\n?/g,"\\n").replace(/\\u00a0/g," ").normalize("NFC"));const b=Array.from(String(typed??"").replace(/\\r\\n?/g,"\\n").replace(/\\u00a0/g," ").normalize("NFC"));if(!b.length)return{distance:0,prefixLength:0,accuracy:0};let previous=Array.from({length:b.length+1},(_,index)=>index);let bestDistance=previous[b.length],bestPrefix=0;for(let row=1;row<=a.length;row++){const current=[row];for(let column=1;column<=b.length;column++){current[column]=Math.min(current[column-1]+1,previous[column]+1,previous[column-1]+(a[row-1]===b[column-1]?0:1))}const distance=current[b.length];if(distance<bestDistance||(distance===bestDistance&&row>bestPrefix)){bestDistance=distance;bestPrefix=row}previous=current}const denominator=Math.max(bestPrefix,b.length,1);return{distance:bestDistance,prefixLength:bestPrefix,accuracy:Math.max(0,(denominator-bestDistance)/denominator*100)}}
function liveMetrics(){if(!typingState||!$("typingInput"))return;const text=$("typingInput").value;const started=new Date(typingState.startedAt).getTime();const elapsed=Math.max(1,Math.floor((Date.now()-started)/1000));const gross=(Array.from(text).length/5)/(elapsed/60);const attempted=attemptedTypingMetrics(typingState.passage,text);$("typingElapsed").textContent=formatTime(elapsed);$("typingWpm").textContent=gross.toFixed(1);$("typingAccuracy").textContent=attempted.accuracy.toFixed(1)+"%";$("typingCharacters").textContent=Array.from(text).length;const remaining=Number(typingState.durationSeconds)-elapsed;$("typingRemaining").textContent=formatTime(remaining);if(remaining<=0)submitTyping(true)}'''
          if text.count(old) != 1:
              raise SystemExit(f'page live metric block mismatch: {text.count(old)}')
          text = text.replace(old, new, 1)
          text = text.replace(
              'Live speed and overall estimated accuracy are shown.',
              'Live speed and attempted-text estimated accuracy are shown.',
          )
          text = text.replace(
              '<div class="metric"><b>'+"'"+'+Number(result.netWpm||0).toFixed(1)+'+"'"+'</b><span>Net WPM</span></div><div class="metric"><b>'+"'"+'+Number(result.accuracy||0).toFixed(1)+'+"'"+'%</b><span>Accuracy</span></div><div class="metric"><b>'+"'"+'+esc(result.correctWords||0)+'+"'"+'</b><span>Correct Words</span></div><div class="metric"><b>'+"'"+'+esc(result.incorrectWords||0)+'+"'"+'</b><span>Word Errors</span></div>',
              '<div class="metric"><b>'+"'"+'+Number(result.grossWpm||0).toFixed(1)+'+"'"+'</b><span>Gross WPM</span></div><div class="metric"><b>'+"'"+'+Number(result.netWpm||0).toFixed(1)+'+"'"+'</b><span>Net WPM</span></div><div class="metric"><b>'+"'"+'+Number(result.accuracy||0).toFixed(1)+'+"'"+'%</b><span>Accuracy</span></div><div class="metric"><b>'+"'"+'+Number(result.completionPercentage||0).toFixed(1)+'+"'"+'%</b><span>Completion</span></div>',
          )
          page.write_text(text)

          readme = Path('backend/src/modules/ats-assessment/README.md')
          text = readme.read_text()
          old = '''- gross WPM based on five characters per word
- edit-distance-based accuracy
- net WPM after error penalty
- aligned correct, substituted, missing, and extra word feedback
- configured process-role speed and accuracy benchmarks'''
          new = '''- gross WPM = typed characters / 5 / elapsed minutes
- Levenshtein accuracy over the portion of the passage actually attempted
- untouched passage remainder tracked as completion/speed, not false accuracy errors
- net WPM = gross WPM × accuracy percentage
- 60% accuracy / 40% speed ranking score
- passed attempts ranked above failed attempts; ties use score, accuracy, then net WPM
- aligned correct, substituted, missing, and extra word feedback
- standard data-entry accuracy benchmark of 95%, QA benchmark of 97%, and critical document benchmark of 98%'''
          if text.count(old) != 1:
              raise SystemExit(f'README formula block mismatch: {text.count(old)}')
          readme.write_text(text.replace(old, new, 1))
          PY

          rm .github/workflows/typing-scoring-one-time-fix.yml

      - name: Commit integration fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/modules/ats-assessment/assessment.service.ts \
                  backend/src/modules/ats-assessment/assessment.catalog.ts \
                  backend/src/modules/ats-assessment/assessment.page.ts \
                  backend/src/modules/ats-assessment/README.md \
                  .github/workflows/typing-scoring-one-time-fix.yml
          git commit -m "fix(assessment): align typing timing, benchmarks, and attempt ranking"
          git push origin HEAD:fix/typing-test-scoring-accuracy
