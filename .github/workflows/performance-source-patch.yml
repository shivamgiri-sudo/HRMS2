name: Performance Source Patch

on:
  push:
    branches:
      - agent/performance-ingestion-platform

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply canonical publication wiring and migration registration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          service_path = Path('backend/src/modules/performance-ingestion/performance-ingestion.service.ts')
          service = service_path.read_text()
          source_import = 'import { readPerformanceSourceRows } from "./performance-source-adapters.js";'
          publication_import = 'import { publishPerformanceFacts } from "./performance-publication.service.js";'
          if publication_import not in service:
              if source_import not in service:
                  raise SystemExit('Could not locate performance source adapter import')
              service = service.replace(source_import, source_import + '\n' + publication_import, 1)
          if 'async function publishFacts(' in service:
              start = service.index('async function publishFacts(')
              end = service.index('async function saveReconciliation', start)
              service = service[:start] + service[end:]
          service = service.replace(
              'publishedFacts = await publishFacts({',
              'publishedFacts = await publishPerformanceFacts({',
          )
          service_path.write_text(service)

          manifest_path = Path('backend/src/db/runPendingMigrations.ts')
          manifest = manifest_path.read_text()
          migration_520 = '  "520_performance_ingestion_platform.sql",'
          migration_521 = '  "521_performance_multi_source_lineage.sql",'
          if migration_521 not in manifest:
              if migration_520 not in manifest:
                  raise SystemExit('Could not locate migration 520 in canonical manifest')
              manifest = manifest.replace(migration_520, migration_520 + '\n' + migration_521, 1)
          manifest_path.write_text(manifest)
          PY
          if git diff --quiet -- \
            backend/src/modules/performance-ingestion/performance-ingestion.service.ts \
            backend/src/db/runPendingMigrations.ts; then
            echo "Canonical publication patch is already applied."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              backend/src/modules/performance-ingestion/performance-ingestion.service.ts \
              backend/src/db/runPendingMigrations.ts
            git commit -m "feat(performance): aggregate canonical facts across sources"
            git push origin HEAD:agent/performance-ingestion-platform
          fi
