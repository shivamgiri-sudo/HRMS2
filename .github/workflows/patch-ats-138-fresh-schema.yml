name: Patch ATS 138 Fresh Schema

on:
  push:
    branches:
      - codex/performance-staging-certification
    paths:
      - ".github/workflows/patch-ats-138-fresh-schema.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/performance-staging-certification
          fetch-depth: 0

      - name: Patch migration 138
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('backend/sql/138_ats_complete_journey.sql')
          text = path.read_text(encoding='utf-8')
          marker = '-- ── 6. Enhance candidate_onboarding_profile'
          if marker not in text:
              raise SystemExit('section 6 marker missing')

          bootstrap = '''-- ── 5B. Create candidate onboarding profile base table ───────────────────────
          -- Production installations may already have this table from an earlier manual
          -- rollout, but it was absent from the canonical migration manifest. Define the
          -- stable identity/timestamp base before section 6 adds the journey fields.
          CREATE TABLE IF NOT EXISTS candidate_onboarding_profile (
            id CHAR(36) NOT NULL DEFAULT (UUID()) PRIMARY KEY,
            candidate_id CHAR(36) NOT NULL UNIQUE,
            created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,
            updated_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
            INDEX idx_candidate_onboarding_candidate (candidate_id),
            FOREIGN KEY (candidate_id) REFERENCES ats_candidate(id) ON DELETE CASCADE
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;

          '''
          if '5B. Create candidate onboarding profile base table' not in text:
              text = text.replace(marker, bootstrap + marker, 1)

          # branch_master.id is VARCHAR(36) in the canonical schema. Restrict
          # replacements to the two affected table sections.
          payroll_marker = 'CREATE TABLE IF NOT EXISTS ats_payroll_hr_validation ('
          cost_marker = 'CREATE TABLE IF NOT EXISTS cost_centre_master ('
          for start_marker in (payroll_marker, cost_marker):
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f'marker missing: {start_marker}')
              end = text.find(');', start)
              if end < 0:
                  raise SystemExit(f'table end missing: {start_marker}')
              section = text[start:end + 2]
              section = section.replace('branch_id CHAR(36)', 'branch_id VARCHAR(36)', 1)
              text = text[:start] + section + text[end + 2:]

          path.write_text(text, encoding='utf-8', newline='\n')
          PY

          rm .github/workflows/patch-ats-138-fresh-schema.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/sql/138_ats_complete_journey.sql .github/workflows/patch-ats-138-fresh-schema.yml
          git commit -m "fix(migrations): bootstrap ATS onboarding profile"
          git push origin HEAD:codex/performance-staging-certification
