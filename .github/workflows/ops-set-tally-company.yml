# Sets GRN_TALLY_COMPANY in backend/.env on 192.168.11.225: the Tally company the GRN download, the Finance Ledger
# "Tally Export" tab, the Bank Ledger "Tally XML" and the Salary voucher XML write into SVCURRENTCOMPANY, so Tally
# refuses the file when a different company is open instead of booking into it.
# Does NOT restart anything: a restart re-runs boot migrations (the 2026-10-14 outages). The value takes effect at
# the next normal deploy / restart. Backs up .env first and restores it if the key does not end up exactly once.

name: Ops set Tally company (backend .env)

on:
  workflow_dispatch:
    inputs:
      company:
        description: "Exact Tally company name"
        required: true
        default: "MAS CALLNET INDIA PRIVATE LIMITED-2026-27"
      confirm:
        description: "Type SET to write backend/.env"
        required: true

concurrency:
  group: ops-set-tally-company
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  set:
    name: Set GRN_TALLY_COMPANY on 192.168.11.225
    runs-on: self-hosted
    environment: production
    timeout-minutes: 5
    steps:
      - name: Write .env (no restart)
        shell: bash
        env:
          COMPANY: ${{ inputs.company }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          [[ "$CONFIRM" == "SET" ]] || { echo "::error::confirm must be SET"; exit 1; }
          [[ "$COMPANY" =~ ^[A-Za-z0-9\ .\&\(\)-]{3,120}$ ]] || { echo "::error::company has unexpected characters"; exit 1; }
          ENV_FILE="/var/www/HRMS2/backend/.env"
          test -f "$ENV_FILE" || { echo "::error::$ENV_FILE not found."; exit 1; }
          BACKUP="${ENV_FILE}.bak-tally-company-$(date -u +%Y%m%dT%H%M%SZ)"
          cp -a "$ENV_FILE" "$BACKUP"; echo "Backed up to $BACKUP"
          echo "before: $(grep -E '^GRN_TALLY_COMPANY=' "$ENV_FILE" || echo '(not set)')"
          if [[ -s "$ENV_FILE" && -n "$(tail -c 1 "$ENV_FILE")" ]]; then printf '\n' >> "$ENV_FILE"; fi
          sed -i -E '/^GRN_TALLY_COMPANY=/d' "$ENV_FILE"
          printf 'GRN_TALLY_COMPANY="%s"\n' "$COMPANY" >> "$ENV_FILE"
          [[ "$(grep -cE '^GRN_TALLY_COMPANY=' "$ENV_FILE")" == "1" ]] || { echo "::error::key not exactly once; restoring"; cp -a "$BACKUP" "$ENV_FILE"; exit 1; }
          echo "after:  $(grep -E '^GRN_TALLY_COMPANY=' "$ENV_FILE")"
          echo "Not restarted: takes effect at the next deploy."
