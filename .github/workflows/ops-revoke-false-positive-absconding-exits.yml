name: Ops Revoke False-Positive Absconding Exits (manual)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run reports current state and writes nothing"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      confirm:
        description: "To APPLY, type: revoke-false-positive-absconding-exits"
        required: false
        type: string

concurrency:
  group: ops-revoke-false-positive-absconding-exits
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  revoke:
    name: "Revoke false-positive absconding exits (${{ inputs.mode }})"
    runs-on: self-hosted
    environment: production
    timeout-minutes: 10

    steps:
      - name: Refuse an unconfirmed apply
        if: inputs.mode == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm }}" != "revoke-false-positive-absconding-exits" ]; then
            echo "::error::To apply, 'confirm' must be exactly 'revoke-false-positive-absconding-exits'."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Run
        working-directory: backend
        shell: bash
        env:
          DOTENV_CONFIG_PATH: /var/www/HRMS2/backend/.env
          NODE_ENV: production
        run: |
          set -euo pipefail
          FLAG=""; [ "${{ inputs.mode }}" = "apply" ] && FLAG="--apply"
          npx tsx scripts/revoke-false-positive-absconding-exits.ts $FLAG
