name: Ops GRN Approval-Bucket Diagnose (manual, read-only)

# One-off, read-only diagnostic: lists GRNs stuck at a given GRN approval stage, resolves a
# user's active roles, and flags whether that user would be blocked by the maker-checker
# self-review guard vs. the stage's role gate. Split into its own workflow because
# ops-scripts.yml's run block is already over GitHub's 21000-char expression limit and
# cannot take new entries without a separate trim.

on:
  workflow_dispatch:
    inputs:
      approver_email:
        description: "User email to check roles/blocks for"
        required: true
        type: string
      stage:
        description: "Which bucket to check"
        required: true
        default: accounts_head
        type: choice
        options:
          - accounts_head
          - finance_head

concurrency:
  group: ops-grn-accounts-head-diagnose
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diagnose:
    name: GRN approval-bucket pending diagnose
    runs-on: self-hosted
    environment: production
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Run diagnostic
        working-directory: backend
        shell: bash
        env:
          DOTENV_CONFIG_PATH: /var/www/HRMS2/backend/.env
          NODE_ENV: production
        run: npx tsx scripts/grn-accounts-head-pending-diagnose.ts "${{ inputs.approver_email }}" "${{ inputs.stage }}"
