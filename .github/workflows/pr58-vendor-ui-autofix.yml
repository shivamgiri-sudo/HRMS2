name: PR58 Vendor UI Autofix

on:
  push:
    branches:
      - agent/finance-pnl-lob-refactor
    paths:
      - .github/workflows/pr58-vendor-ui-autofix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finance-pnl-lob-refactor
          fetch-depth: 0

      - name: Apply guarded vendor UI fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          file = Path('src/pages/NativeVendorManagement.tsx')
          text = file.read_text()

          old = "useVendors(typeFilter !== 'all' ? { vendor_type: typeFilter } : { is_active: 'true' })"
          new = "useVendors(typeFilter !== 'all' ? { is_active: 'true', vendor_type: typeFilter } : { is_active: 'true' })"
          if text.count(old) != 1:
              raise SystemExit(f'Vendor filter insertion point mismatch: {text.count(old)}')
          text = text.replace(old, new, 1)

          old = "if (!form.vendor_name.trim()) { toast.error('Vendor name is required'); return; }"
          new = "if (!form.vendor_code.trim() || !form.vendor_name.trim()) { toast.error('Vendor code and vendor name are required'); return; }"
          if text.count(old) != 1:
              raise SystemExit(f'Vendor validation insertion point mismatch: {text.count(old)}')
          text = text.replace(old, new, 1)

          file.write_text(text)
          PY

          rm .github/workflows/pr58-vendor-ui-autofix.yml

      - name: Commit vendor UI fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/NativeVendorManagement.tsx .github/workflows/pr58-vendor-ui-autofix.yml
          git commit -m "fix(finance): keep vendor filters active and validate vendor code"
          git push origin HEAD:agent/finance-pnl-lob-refactor
