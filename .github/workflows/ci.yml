name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint and retain JSON report
        id: eslint
        continue-on-error: true
        run: npm run lint -- --format json --output-file eslint-report.json

      - name: Upload ESLint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-eslint-report
          path: eslint-report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce ESLint result
        if: always()
        env:
          ESLINT_OUTCOME: ${{ steps.eslint.outcome }}
        run: test "$ESLINT_OUTCOME" = "success"

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compiler
        run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://example.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-key-for-build' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/
          retention-days: 7

  security-tests:
    name: Security and RBAC Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Authentication security contract
        id: auth_security
        continue-on-error: true
        run: >-
          npm --prefix backend exec -- vitest run
          src/modules/auth/__tests__/auth-security.test.ts
          --reporter=json --outputFile=auth-security.json

      - name: Document vault security contract
        id: vault_security
        continue-on-error: true
        run: >-
          npm --prefix backend exec -- vitest run
          src/modules/files/__tests__/document-vault-security.test.ts
          --reporter=json --outputFile=document-vault-security.json

      - name: Migration governance contract
        id: migration_security
        continue-on-error: true
        run: >-
          npm --prefix backend exec -- vitest run
          src/db/__tests__/migration-governance.test.ts
          --reporter=json --outputFile=migration-governance.json

      - name: Database connection reliability contract
        id: connection_security
        continue-on-error: true
        run: >-
          npm --prefix backend exec -- vitest run
          src/db/__tests__/connection-reliability.test.ts
          --reporter=json --outputFile=connection-reliability.json

      - name: Worker safety contract
        id: worker_security
        continue-on-error: true
        run: >-
          npm --prefix backend exec -- vitest run
          src/workers/__tests__/worker-safety.test.ts
          --reporter=json --outputFile=worker-safety.json

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-security-reports
          path: |
            backend/auth-security.json
            backend/document-vault-security.json
            backend/migration-governance.json
            backend/connection-reliability.json
            backend/worker-safety.json
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce security contract results
        if: always()
        env:
          AUTH_OUTCOME: ${{ steps.auth_security.outcome }}
          VAULT_OUTCOME: ${{ steps.vault_security.outcome }}
          MIGRATION_OUTCOME: ${{ steps.migration_security.outcome }}
          CONNECTION_OUTCOME: ${{ steps.connection_security.outcome }}
          WORKER_OUTCOME: ${{ steps.worker_security.outcome }}
        run: |
          printf 'auth=%s vault=%s migration=%s connection=%s worker=%s\n' \
            "$AUTH_OUTCOME" "$VAULT_OUTCOME" "$MIGRATION_OUTCOME" "$CONNECTION_OUTCOME" "$WORKER_OUTCOME"
          test "$AUTH_OUTCOME" = "success"
          test "$VAULT_OUTCOME" = "success"
          test "$MIGRATION_OUTCOME" = "success"
          test "$CONNECTION_OUTCOME" = "success"
          test "$WORKER_OUTCOME" = "success"

  finance-validation:
    name: Finance API and schema contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Backend typecheck
        run: npm --prefix backend run typecheck

      - name: Finance calculation and schema-contract tests
        run: >-
          npm --prefix backend exec -- vitest run
          src/modules/process-pnl/__tests__/branch-budget.calculation.test.ts
          src/modules/process-pnl/__tests__/bpo-pnl.calculation.test.ts
          src/modules/process-pnl/__tests__/bpo-pnl.schema-contract.test.ts
          src/modules/finance/__tests__/finance.schema-contract.test.ts
          src/modules/finance/__tests__/budget-coverage.contract.test.ts
          src/modules/finance/__tests__/grn-validation-override.contract.test.ts

      - name: Build frontend
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://example.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-key-for-build' }}

      - name: Build backend
        run: npm --prefix backend run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  finance-validation-report:
    name: Finance validation report
    if: always() && github.event_name == 'push' && startsWith(github.ref_name, 'feat/')
    needs: [finance-validation]
    runs-on: ubuntu-latest
    steps:
      - name: Update draft PR validation comment
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.ref.replace('refs/heads/', '');
            const pulls = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${branch}`,
              per_page: 10,
            });
            if (!pulls.data.length) {
              core.info(`No open pull request found for ${branch}`);
              return;
            }

            const pull = pulls.data[0];
            const result = '${{ needs.finance-validation.result }}';
            const marker = '<!-- finance-validation-status -->';
            const passed = result === 'success';
            const body = [
              marker,
              `## ${passed ? '✅' : '❌'} Finance validation ${passed ? 'passed' : 'failed'}`,
              '',
              `- Result: **${result}**`,
              `- Commit: \`${context.sha.slice(0, 12)}\``,
              `- Checks: frontend typecheck, backend typecheck, branch-budget/BPO P&L calculations, finance smart-GRN/coverage/override contracts, frontend build, backend build`,
              `- Workflow: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pull.number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull.number,
                body,
              });
            }
