name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typing-scoring-integration:
    name: Apply typing scoring integration patch
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/typing-test-scoring-accuracy'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout typing fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/typing-test-scoring-accuracy
          fetch-depth: 0

      - name: Apply guarded patch
        run: python .github/scripts/apply-typing-scoring-integration.py

      - name: Remove temporary CI helpers
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f .github/workflows/typing-scoring-one-time-fix.yml
          rm -f .github/scripts/apply-typing-scoring-integration.py

      - name: Commit integrated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/modules/ats-assessment/typing-scoring.ts \
                  backend/src/modules/ats-assessment/assessment.service.ts \
                  backend/src/modules/ats-assessment/assessment.catalog.ts \
                  backend/src/modules/ats-assessment/assessment.page.ts \
                  backend/src/modules/ats-assessment/README.md \
                  .github/workflows/ci.yml \
                  .github/workflows/typing-scoring-one-time-fix.yml \
                  .github/scripts/apply-typing-scoring-integration.py
          git commit -m "fix(assessment): integrate corrected typing scoring end to end"
          git push origin HEAD:fix/typing-test-scoring-accuracy

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # HARDENED: Lint failures now break CI (removed || true and continue-on-error)
      - name: Run ESLint
        run: bun run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run TypeScript compiler
        run: bunx tsc --noEmit

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://example.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-key-for-build' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/
          retention-days: 7

  security-tests:
    name: Security and RBAC Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Run security tests
        run: >-
          npm --prefix backend exec -- vitest run
          src/modules/auth/__tests__/auth-security.test.ts
          src/modules/files/__tests__/document-vault-security.test.ts
          src/db/__tests__/migration-governance.test.ts
          src/db/__tests__/connection-reliability.test.ts
          src/workers/__tests__/worker-safety.test.ts

  finance-validation:
    name: Finance API and schema contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Backend typecheck
        run: npm --prefix backend run typecheck

      - name: Finance calculation and schema-contract tests
        run: >-
          npm --prefix backend exec -- vitest run
          src/modules/process-pnl/__tests__/branch-budget.calculation.test.ts
          src/modules/process-pnl/__tests__/bpo-pnl.calculation.test.ts
          src/modules/process-pnl/__tests__/bpo-pnl.schema-contract.test.ts
          src/modules/finance/__tests__/finance.schema-contract.test.ts
          src/modules/finance/__tests__/budget-coverage.contract.test.ts
          src/modules/finance/__tests__/grn-validation-override.contract.test.ts

      - name: Build frontend
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://example.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-key-for-build' }}

      - name: Build backend
        run: npm --prefix backend run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  finance-validation-report:
    name: Finance validation report
    if: always() && github.event_name == 'push' && startsWith(github.ref_name, 'feat/')
    needs: [finance-validation]
    runs-on: ubuntu-latest
    steps:
      - name: Update draft PR validation comment
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.ref.replace('refs/heads/', '');
            const pulls = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${branch}`,
              per_page: 10,
            });
            if (!pulls.data.length) {
              core.info(`No open pull request found for ${branch}`);
              return;
            }

            const pull = pulls.data[0];
            const result = '${{ needs.finance-validation.result }}';
            const marker = '<!-- finance-validation-status -->';
            const passed = result === 'success';
            const body = [
              marker,
              `## ${passed ? '✅' : '❌'} Finance validation ${passed ? 'passed' : 'failed'}`,
              '',
              `- Result: **${result}**`,
              `- Commit: \`${context.sha.slice(0, 12)}\``,
              `- Checks: frontend typecheck, backend typecheck, branch-budget/BPO P&L calculations, finance smart-GRN/coverage/override contracts, frontend build, backend build`,
              `- Workflow: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pull.number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull.number,
                body,
              });
            }
