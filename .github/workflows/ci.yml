name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint changed JavaScript and TypeScript files
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$GITHUB_BASE_REF" --depth=1
            range="origin/$GITHUB_BASE_REF...HEAD"
          else
            before="${{ github.event.before }}"
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ]; then
              git fetch origin "$before" --depth=1 || true
              range="$before..HEAD"
            else
              range="HEAD^..HEAD"
            fi
          fi

          mapfile -t changed_files < <(
            git diff --name-only --diff-filter=ACMR "$range" |
              grep -E '\.(cjs|js|jsx|mjs|ts|tsx)$' || true
          )

          lint_files=()
          for file in "${changed_files[@]}"; do
            if [ -f "$file" ]; then
              lint_files+=("$file")
            fi
          done

          if [ "${#lint_files[@]}" -eq 0 ]; then
            echo "No changed JavaScript or TypeScript files require linting."
            exit 0
          fi

          printf 'Linting %s changed files:\n' "${#lint_files[@]}"
          printf ' - %s\n' "${lint_files[@]}"
          npx eslint "${lint_files[@]}"

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compiler
        run: npm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://example.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-key-for-build' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/
          retention-days: 7

  security-tests:
    name: Security and RBAC Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Authentication security contract
        shell: bash
        run: |
          for attempt in 1 2; do
            (cd backend && npm exec -- vitest run src/modules/auth/__tests__/auth-security.test.ts) && exit 0
            echo "Authentication security contract attempt $attempt failed."
          done
          exit 1

      - name: Document vault security contract
        shell: bash
        run: |
          for attempt in 1 2; do
            (cd backend && npm exec -- vitest run src/modules/files/__tests__/document-vault-security.test.ts) && exit 0
            echo "Document vault security contract attempt $attempt failed."
          done
          exit 1

      - name: Migration governance contract
        shell: bash
        run: |
          for attempt in 1 2; do
            (cd backend && npm exec -- vitest run src/db/__tests__/migration-governance.test.ts) && exit 0
            echo "Migration governance contract attempt $attempt failed."
          done
          exit 1

      - name: Database connection reliability contract
        shell: bash
        run: |
          for attempt in 1 2; do
            (cd backend && npm exec -- vitest run src/db/__tests__/connection-reliability.test.ts) && exit 0
            echo "Database connection reliability contract attempt $attempt failed."
          done
          exit 1

      - name: Worker safety contract
        shell: bash
        run: |
          for attempt in 1 2; do
            (cd backend && npm exec -- vitest run src/workers/__tests__/worker-safety.test.ts) && exit 0
            echo "Worker safety contract attempt $attempt failed."
          done
          exit 1

      # These seven suites cover payroll authorization, role administration, the
      # access audit log, ATS scope, PII masking, audit logging, employee
      # privacy/ownership and the feedback workflow. Every one of them was 100%
      # failing on main for over a month — each sent a "<role>.token" placeholder
      # that stopped authenticating when auth moved to MySQL JWTs, so all they
      # proved was that unauthenticated requests get rejected.
      #
      # Nothing caught it, because this job ran a hand-picked list that happened
      # not to include them. Listing them here is the point: a security suite
      # that is not in CI is a security suite that can rot silently.
      - name: Payroll, access and lifecycle security suites
        shell: bash
        run: |
          for attempt in 1 2; do
            (cd backend && npm exec -- vitest run \
              tests/payroll.security.test.ts \
              tests/pr16.security.test.ts \
              tests/platform.foundation.test.ts \
              tests/ats.wfm.completion.test.ts \
              tests/management.performance.test.ts \
              tests/performance-feedback.integration.test.ts \
              tests/employee.lifecycle.test.ts) && exit 0
            echo "Payroll/access/lifecycle security suites attempt $attempt failed."
          done
          exit 1

  finance-validation:
    name: Finance API and schema contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Backend typecheck
        run: npm --prefix backend run typecheck

      - name: Finance calculation and schema-contract tests
        run: >-
          npm --prefix backend exec -- vitest run
          src/modules/process-pnl/__tests__/branch-budget.calculation.test.ts
          src/modules/process-pnl/__tests__/bpo-pnl.calculation.test.ts
          src/modules/process-pnl/__tests__/bpo-pnl.schema-contract.test.ts
          src/modules/finance/__tests__/finance.schema-contract.test.ts
          src/modules/finance/__tests__/budget-coverage.contract.test.ts
          src/modules/finance/__tests__/grn-validation-override.contract.test.ts

      - name: Build frontend
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://example.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-key-for-build' }}

      - name: Build backend
        run: npm --prefix backend run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  finance-validation-report:
    name: Finance validation report
    if: always() && github.event_name == 'push' && startsWith(github.ref_name, 'feat/')
    needs: [finance-validation]
    runs-on: ubuntu-latest
    steps:
      - name: Update draft PR validation comment
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.ref.replace('refs/heads/', '');
            const pulls = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${branch}`,
              per_page: 10,
            });
            if (!pulls.data.length) {
              core.info(`No open pull request found for ${branch}`);
              return;
            }

            const pull = pulls.data[0];
            const result = '${{ needs.finance-validation.result }}';
            const marker = '<!-- finance-validation-status -->';
            const passed = result === 'success';
            const body = [
              marker,
              `## ${passed ? '✅' : '❌'} Finance validation ${passed ? 'passed' : 'failed'}`,
              '',
              `- Result: **${result}**`,
              `- Commit: \`${context.sha.slice(0, 12)}\``,
              `- Checks: frontend typecheck, backend typecheck, branch-budget/BPO P&L calculations, finance smart-GRN/coverage/override contracts, frontend build, backend build`,
              `- Workflow: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pull.number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull.number,
                body,
              });
            }
