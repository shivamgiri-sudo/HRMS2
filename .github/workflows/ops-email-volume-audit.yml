name: Ops email volume audit (manual, read-only)

# Read-only: outbound email volume per sender/template from the send logs. Writes nothing.
on:
  workflow_dispatch:

concurrency:
  group: ops-email-volume-audit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    name: Email volume audit
    runs-on: self-hosted
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install backend deps
        working-directory: backend
        run: npm ci
      - name: Audit (read-only)
        working-directory: backend
        shell: bash
        env:
          DOTENV_CONFIG_PATH: /var/www/HRMS2/backend/.env
          NODE_ENV: production
        run: |
          set -euo pipefail
          test -f "$DOTENV_CONFIG_PATH" || { echo "::error::production .env not found"; exit 1; }
          npx tsx scripts/email-volume-audit.ts 7
