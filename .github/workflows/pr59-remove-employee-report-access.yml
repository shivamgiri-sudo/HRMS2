name: PR59 Remove Employee Report Access

on:
  push:
    branches:
      - agent/deep-section-reports
    paths:
      - .github/workflows/pr59-remove-employee-report-access.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pr59-remove-employee-report-access.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/deep-section-reports
          fetch-depth: 0

      - name: Remove general employee role from management reports
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          master = Path('backend/src/modules/reporting/bpo-master-report-catalog.ts')
          text = master.read_text()
          old = 'viewRoles: [...new Set([...OPERATIONS, ...HR, ...QUALITY, "employee"])],'
          new = 'viewRoles: [...new Set([...OPERATIONS, ...HR, ...QUALITY])],'
          if text.count(old) != 1:
            raise SystemExit(f'BPO employee role replacement mismatch: {text.count(old)}')
          master.write_text(text.replace(old, new, 1))

          packs = Path('backend/src/modules/reporting/deep-report-packs.ts')
          pack_text = packs.read_text()
          replacements = {
            'viewRoles: [...new Set([...HR, ...OPERATIONS, "employee"])],': 'viewRoles: [...new Set([...HR, ...OPERATIONS])],',
            'viewRoles: [...new Set([...HR, ...MANAGEMENT, "employee"])],': 'viewRoles: [...new Set([...HR, ...MANAGEMENT])],',
          }
          for old_value, new_value in replacements.items():
            if pack_text.count(old_value) != 1:
              raise SystemExit(f'Deep pack employee role replacement mismatch: {old_value} -> {pack_text.count(old_value)}')
            pack_text = pack_text.replace(old_value, new_value, 1)
          packs.write_text(pack_text)
          PY

          rm .github/workflows/pr59-remove-employee-report-access.yml

      - name: Commit RBAC correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/modules/reporting/bpo-master-report-catalog.ts \
                  backend/src/modules/reporting/deep-report-packs.ts \
                  .github/workflows/pr59-remove-employee-report-access.yml
          git commit -m "fix(reports): restrict management reports to authorised functional roles"
          git push origin HEAD:agent/deep-section-reports
