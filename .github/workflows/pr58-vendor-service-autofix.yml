name: PR58 Vendor Service Autofix

on:
  push:
    branches:
      - agent/finance-pnl-lob-refactor
    paths:
      - .github/workflows/pr58-vendor-service-autofix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finance-pnl-lob-refactor
          fetch-depth: 0

      - name: Replace vendor service with validated patch semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          file = Path('backend/src/modules/erp/erp.service.ts')
          text = file.read_text()
          start_marker = '// ─── Vendors ────────────────────────────────────────────────────────────────'
          end_marker = '// ─── Contracts ──────────────────────────────────────────────────────────────'
          start = text.index(start_marker)
          end = text.index(end_marker, start)

          replacement = r'''// ─── Vendors ────────────────────────────────────────────────────────────────

const VENDOR_STRING_FIELDS = [
  "vendor_code",
  "vendor_name",
  "vendor_type",
  "contact_name",
  "contact_email",
  "contact_phone",
  "address",
  "gst_number",
  "pan_number",
  "payment_terms",
] as const;

function hasOwn(data: Record<string, unknown>, key: string) {
  return Object.prototype.hasOwnProperty.call(data, key);
}

function cleanNullable(value: unknown) {
  const text = String(value ?? "").trim();
  return text || null;
}

function normalizeVendorInput(data: Record<string, unknown>) {
  const normalized: Record<string, unknown> = {};
  for (const key of VENDOR_STRING_FIELDS) {
    if (!hasOwn(data, key)) continue;
    const value = cleanNullable(data[key]);
    normalized[key] = ["vendor_code", "gst_number", "pan_number"].includes(key)
      ? value?.toUpperCase().replace(/\s+/g, "") ?? null
      : value;
  }
  if (hasOwn(data, "is_active")) {
    normalized.is_active = data.is_active === false || Number(data.is_active) === 0 ? 0 : 1;
  }
  return normalized;
}

function validateVendorInput(data: Record<string, unknown>, creating: boolean) {
  const code = cleanNullable(data.vendor_code);
  const name = cleanNullable(data.vendor_name);
  if (creating && (!code || !name)) {
    throw new Error("vendor_code and vendor_name are required");
  }
  if (hasOwn(data, "vendor_code") && !code) throw new Error("Vendor code cannot be empty");
  if (hasOwn(data, "vendor_name") && !name) throw new Error("Vendor name cannot be empty");

  const pan = cleanNullable(data.pan_number)?.toUpperCase();
  if (pan && !/^[A-Z]{5}[0-9]{4}[A-Z]$/.test(pan)) {
    throw new Error("PAN must follow the format ABCDE1234F");
  }
  const gst = cleanNullable(data.gst_number)?.toUpperCase().replace(/\s+/g, "");
  if (gst && !/^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/.test(gst)) {
    throw new Error("GSTIN must be a valid 15-character Indian GST registration number");
  }
  const email = cleanNullable(data.contact_email);
  if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    throw new Error("Vendor contact email is invalid");
  }
}

async function assertVendorUnique(data: Record<string, unknown>, excludeId?: string) {
  const checks: Array<{ column: string; value: string | null; label: string }> = [
    { column: "vendor_code", value: cleanNullable(data.vendor_code)?.toUpperCase() ?? null, label: "Vendor code" },
    { column: "gst_number", value: cleanNullable(data.gst_number)?.toUpperCase().replace(/\s+/g, "") ?? null, label: "GSTIN" },
    { column: "pan_number", value: cleanNullable(data.pan_number)?.toUpperCase().replace(/\s+/g, "") ?? null, label: "PAN" },
  ];
  for (const check of checks) {
    if (!check.value) continue;
    const [rows] = await db.execute<RowDataPacket[]>(
      `SELECT id FROM vendor_master
        WHERE UPPER(REPLACE(COALESCE(${check.column}, ''), ' ', '')) = ?
          ${excludeId ? "AND id <> ?" : ""}
        LIMIT 1`,
      excludeId ? [check.value, excludeId] : [check.value]
    );
    if (rows[0]) throw new Error(`${check.label} is already used by another vendor`);
  }
}

export const vendorService = {
  async list(filters: { is_active?: string; vendor_type?: string }) {
    const conds: string[] = [];
    const params: unknown[] = [];
    if (filters.is_active !== undefined) {
      conds.push("is_active = ?");
      params.push(filters.is_active === "false" || filters.is_active === "0" ? 0 : 1);
    }
    if (filters.vendor_type) {
      conds.push("vendor_type = ?");
      params.push(filters.vendor_type);
    }
    const where = conds.length ? `WHERE ${conds.join(" AND ")}` : "";
    const [rows] = await db.execute<RowDataPacket[]>(
      `SELECT * FROM vendor_master ${where} ORDER BY vendor_name`,
      params
    );
    return rows as RowDataPacket[];
  },

  async getById(id: string) {
    const [rows] = await db.execute<RowDataPacket[]>(
      "SELECT * FROM vendor_master WHERE id = ? LIMIT 1",
      [id]
    );
    return (rows as RowDataPacket[])[0] ?? null;
  },

  async create(data: Record<string, unknown>) {
    const normalized = normalizeVendorInput(data);
    validateVendorInput(normalized, true);
    await assertVendorUnique(normalized);
    const id = randomUUID();
    await db.execute(
      `INSERT INTO vendor_master
         (id, vendor_code, vendor_name, vendor_type, contact_name, contact_email,
          contact_phone, address, gst_number, pan_number, payment_terms, is_active)
       VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)`,
      [
        id,
        normalized.vendor_code,
        normalized.vendor_name,
        normalized.vendor_type ?? "supplier",
        normalized.contact_name ?? null,
        normalized.contact_email ?? null,
        normalized.contact_phone ?? null,
        normalized.address ?? null,
        normalized.gst_number ?? null,
        normalized.pan_number ?? null,
        normalized.payment_terms ?? null,
        normalized.is_active ?? 1,
      ]
    );
    return this.getById(id);
  },

  async update(id: string, data: Record<string, unknown>) {
    const existing = await this.getById(id);
    if (!existing) return null;
    const normalized = normalizeVendorInput(data);
    validateVendorInput(normalized, false);
    await assertVendorUnique(normalized, id);

    const allowed = [...VENDOR_STRING_FIELDS, "is_active"] as const;
    const sets: string[] = [];
    const params: unknown[] = [];
    for (const key of allowed) {
      if (!hasOwn(normalized, key)) continue;
      sets.push(`${key} = ?`);
      params.push(normalized[key]);
    }
    if (!sets.length) return existing;
    sets.push("updated_at = NOW()");
    params.push(id);
    await db.execute(
      `UPDATE vendor_master SET ${sets.join(", ")} WHERE id = ?`,
      params
    );
    return this.getById(id);
  },
};

'''

          file.write_text(text[:start] + replacement + text[end:])
          PY

          rm .github/workflows/pr58-vendor-service-autofix.yml

      - name: Commit vendor service hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/modules/erp/erp.service.ts .github/workflows/pr58-vendor-service-autofix.yml
          git commit -m "fix(finance): validate and normalize Vendor Master updates"
          git push origin HEAD:agent/finance-pnl-lob-refactor
