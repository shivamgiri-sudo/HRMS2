name: Ops Vendor GST Audit (manual, read-only)

# Finds where db_bill keeps vendor GSTINs and maps them to HRMS vendor_master. Writes nothing.

on:
  workflow_dispatch:

concurrency:
  group: ops-vendor-gst-audit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: self-hosted
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install backend deps
        working-directory: backend
        run: npm ci
      - name: Audit
        working-directory: backend
        env:
          DOTENV_CONFIG_PATH: /var/www/HRMS2/backend/.env
          NODE_ENV: production
        run: node scripts/vendor-gst-from-dbbill-audit.mjs
