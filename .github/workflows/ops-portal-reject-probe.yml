name: Ops portal reject probe (manual, read-only)

# Read-only: why the portal rejects uploaded rows (GET only). Writes nothing.
on:
  workflow_dispatch:

concurrency:
  group: ops-portal-reject-probe
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    name: Portal reject probe
    runs-on: self-hosted
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install backend deps
        working-directory: backend
        run: npm ci
      - name: Audit (read-only)
        working-directory: backend
        shell: bash
        env:
          DOTENV_CONFIG_PATH: /var/www/HRMS2/backend/.env
          NODE_ENV: production
        run: |
          set -euo pipefail
          test -f "$DOTENV_CONFIG_PATH" || { echo "::error::production .env not found"; exit 1; }
          npx tsx scripts/portal-reject-probe.ts
