name: PR58 Notification Type Autofix

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pr58-notification-type-autofix.yml
  push:
    branches:
      - agent/finance-pnl-lob-refactor
    paths:
      - .github/workflows/pr58-notification-type-autofix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finance-pnl-lob-refactor
          fetch-depth: 0

      - name: Apply guarded type-only replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          file = Path('backend/src/services/notification.service.ts')
          text = file.read_text()

          old = '  id?: string;\n  email?: string;'
          new = '  id?: string;\n  user_id?: string;\n  email?: string;'
          if text.count(old) != 1:
              raise SystemExit(f'NotificationRecipient field insertion point mismatch: {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''          const [subs] = await db.execute<RowDataPacket[]>(
            `SELECT endpoint, p256dh, auth_key FROM push_subscriptions WHERE user_id = ?`,
            [recipient.user_id],
          );'''
          new = '''          const [subs] = await (db.execute(
            `SELECT endpoint, p256dh, auth_key FROM push_subscriptions WHERE user_id = ?`,
            [recipient.user_id],
          ) as Promise<[RowDataPacket[], unknown]>);'''
          if text.count(old) != 1:
              raise SystemExit(f'Push subscription query block mismatch: {text.count(old)}')
          file.write_text(text.replace(old, new, 1))
          PY

          rm .github/workflows/pr58-notification-type-autofix.yml

      - name: Commit type-only correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/services/notification.service.ts \
                  .github/workflows/pr58-notification-type-autofix.yml
          git commit -m "fix(types): align notification recipient and push subscription query"
          git push origin HEAD:agent/finance-pnl-lob-refactor
