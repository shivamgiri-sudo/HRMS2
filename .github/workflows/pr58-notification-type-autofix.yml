name: PR58 Notification Type Autofix

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pr58-notification-type-autofix.yml
  push:
    branches:
      - agent/finance-pnl-lob-refactor
    paths:
      - .github/workflows/pr58-notification-type-autofix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finance-pnl-lob-refactor
          fetch-depth: 0

      - name: Apply guarded type-only replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          file = Path('backend/src/services/notification.service.ts')
          text = file.read_text()

          interface_pattern = re.compile(
              r'(export interface NotificationRecipient\s*\{[\s\S]*?\n\s*id\?: string;\n)(\s*email\?: string;)',
              re.MULTILINE,
          )
          text, interface_count = interface_pattern.subn(
              r'\1  user_id?: string;\n\2',
              text,
              count=1,
          )
          if interface_count != 1:
              raise SystemExit(f'NotificationRecipient interface mismatch: {interface_count}')

          query_pattern = re.compile(
              r'const \[subs\] = await db\.execute<RowDataPacket\[\]>\(\s*'
              r'(`SELECT endpoint, p256dh, auth_key FROM push_subscriptions WHERE user_id = \?`,)\s*'
              r'(\[recipient\.user_id\],)\s*'
              r'\);',
              re.MULTILINE,
          )
          text, query_count = query_pattern.subn(
              r'const [subs] = await (db.execute(\n            \1\n            \2\n          ) as Promise<[RowDataPacket[], unknown]>);',
              text,
              count=1,
          )
          if query_count != 1:
              raise SystemExit(f'Push subscription query mismatch: {query_count}')

          file.write_text(text)
          PY

          rm .github/workflows/pr58-notification-type-autofix.yml

      - name: Commit type-only correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/services/notification.service.ts \
                  .github/workflows/pr58-notification-type-autofix.yml
          git commit -m "fix(types): align notification recipient and push subscription query"
          git push origin HEAD:agent/finance-pnl-lob-refactor
