# Points the candidate-reply reader (inbound email poller) at the mailbox the server already SENDS from, so replies to invitation
# emails reach the Responses queue. Nothing is typed in here: the IMAP user and password are copied on the server from the existing
# SMTP_USER / SMTP_PASS in backend/.env and are never printed. Reply-To becomes <smtp user>+{token}@<domain> so each reply carries its
# answer token (Gmail / Google Workspace plus-addressing).
#
# Changes on 192.168.11.225: backend/.env INBOUND_EMAIL_MODE, INBOUND_EMAIL_IMAP_HOST/PORT/USER/PASS, INBOUND_EMAIL_REPLY_TO, then
# restarts hrms2-backend and hrms2-workers. A backup of .env is kept next to it. dry_run reads and matches but records nothing.
# Runs on the self-hosted runner because backend/.env and pm2 exist only on 192.168.11.225.

name: Ops inbound email (enable/disable)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "off | dry_run (reads and matches, records nothing) | live (records replies into the Responses queue)"
        required: true
        type: choice
        default: dry_run
        options: [off, dry_run, live]
      imap_host:
        description: "IMAP host of the sending mailbox"
        required: true
        default: "imap.gmail.com"

concurrency:
  group: ops-inbound-email-flag
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  flag:
    name: Set inbound email mode on 192.168.11.225
    runs-on: self-hosted
    environment: production
    timeout-minutes: 10
    steps:
      - name: Set .env and restart
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          IMAP_HOST: ${{ inputs.imap_host }}
        run: |
          set -euo pipefail
          [[ "$IMAP_HOST" =~ ^[A-Za-z0-9.-]{3,100}$ ]] || { echo "::error::imap_host looks wrong"; exit 1; }
          ENV_FILE="/var/www/HRMS2/backend/.env"
          test -f "$ENV_FILE" || { echo "::error::$ENV_FILE not found."; exit 1; }
          getv() { grep -E "^$1=" "$ENV_FILE" | tail -1 | cut -d= -f2- | sed -E 's/^"(.*)"$/\1/; s/^'"'"'(.*)'"'"'$/\1/'; }
          SMTP_USER_V="$(getv SMTP_USER)"; SMTP_PASS_V="$(getv SMTP_PASS | tr -d ' ')"
          if [[ "$MODE" != "off" ]]; then
            [[ -n "$SMTP_USER_V" && -n "$SMTP_PASS_V" && "$SMTP_USER_V" == *@* ]] || { echo "::error::SMTP_USER / SMTP_PASS are not set in .env"; exit 1; }
          fi
          BACKUP="${ENV_FILE}.bak-inbound-$(date -u +%Y%m%dT%H%M%SZ)"
          cp -a "$ENV_FILE" "$BACKUP"; echo "Backed up to $BACKUP"
          if [[ -s "$ENV_FILE" && -n "$(tail -c 1 "$ENV_FILE")" ]]; then printf '\n' >> "$ENV_FILE"; fi
          sed -i -E "/^INBOUND_EMAIL_(MODE|IMAP_HOST|IMAP_PORT|IMAP_USER|IMAP_PASS|REPLY_TO)=/d" "$ENV_FILE"
          printf 'INBOUND_EMAIL_MODE=%s\n' "$MODE" >> "$ENV_FILE"
          if [[ "$MODE" != "off" ]]; then
            LOCAL="${SMTP_USER_V%@*}"; DOMAIN="${SMTP_USER_V#*@}"
            printf 'INBOUND_EMAIL_IMAP_HOST=%s\nINBOUND_EMAIL_IMAP_PORT=993\nINBOUND_EMAIL_IMAP_USER=%s\nINBOUND_EMAIL_IMAP_PASS=%s\nINBOUND_EMAIL_REPLY_TO=%s+{token}@%s\n' \
              "$IMAP_HOST" "$SMTP_USER_V" "$SMTP_PASS_V" "$LOCAL" "$DOMAIN" >> "$ENV_FILE"
          fi
          echo "Mailbox in use: ${SMTP_USER_V%@*}@${SMTP_USER_V#*@} (password not shown)"
          grep -E "^INBOUND_EMAIL_(MODE|IMAP_HOST|IMAP_PORT|REPLY_TO)=" "$ENV_FILE"
          pm2 restart hrms2-backend hrms2-workers --update-env --no-color
          pm2 save --no-color
          pm2 status --no-color
