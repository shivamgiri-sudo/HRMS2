name: Ops Control Tower Inactive-People Probe (manual, read-only)

# Tallies the employment state of everyone each Ops Control Tower drill-down lists. Writes nothing.

on:
  workflow_dispatch:

concurrency:
  group: ops-control-inactive-probe
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: self-hosted
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install backend deps
        working-directory: backend
        run: npm ci
      - name: Audit
        working-directory: backend
        env:
          DOTENV_CONFIG_PATH: /var/www/HRMS2/backend/.env
          NODE_ENV: production
        run: npx tsx scripts/probe-ops-inactive.ts
