name: Ops attrition model lab (manual, read-only)

# Fits an attrition model on weekly past snapshots and tests it on the newest weeks it has not seen, next to the
# current score. Prints AUC and coefficients only. Runs on the production host (database credentials live there).
# Writes nothing.

on:
  workflow_dispatch: {}

concurrency:
  group: ops-attrition-model-lab
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lab:
    name: Attrition model lab (read-only)
    runs-on: self-hosted
    environment: production
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Run the lab
        working-directory: backend
        shell: bash
        env:
          DOTENV_CONFIG_PATH: /var/www/HRMS2/backend/.env
          NODE_ENV: production
        run: |
          set -euo pipefail
          test -f "$DOTENV_CONFIG_PATH" || { echo "::error::$DOTENV_CONFIG_PATH not found - is this the prod host?"; exit 1; }
          npx tsx scripts/attrition-model-lab.ts
