name: Ops backend boot logs (manual, read-only)

# Read-only: the last follow-up worker lines (tick summaries, step failures, guard skips) from the hrms2-workers pm2 log, and the
# pm2 status. Writes nothing. Runs on the self-hosted production runner (pm2 exists only on 192.168.11.225).

on:
  workflow_dispatch: {}

concurrency:
  group: ops-boot-logs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  logs:
    name: Follow-up worker log tail
    runs-on: self-hosted
    environment: production
    timeout-minutes: 5
    steps:
      - name: pm2 status
        shell: bash
        run: pm2 status --no-color
      - name: Follow-up, reader and portal lines (last 60 per process)
        shell: bash
        run: |
          for P in hrms2-backend hrms2-workers; do
            echo "=== $P ==="
            pm2 logs "$P" --nostream --lines 20000 --no-color 2>&1 | grep -vE '"(GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS) /' | grep -E "T1[89]:" | tail -n 300 | cut -c1-300 || true
          done
