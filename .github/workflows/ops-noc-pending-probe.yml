name: Ops NOC Pending Probe (manual, read-only)

# Lists open NOC cases for a branch and the stages they wait on. Writes nothing.

on:
  workflow_dispatch:
    inputs:
      email:
        description: "User email whose roles to print (optional)"
        required: false
        type: string
      branch:
        description: "Branch name"
        required: true
        default: "NOIDA-2"
        type: string

concurrency:
  group: ops-noc-pending-probe
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: self-hosted
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install backend deps
        working-directory: backend
        run: npm ci
      - name: Audit
        working-directory: backend
        env:
          DOTENV_CONFIG_PATH: /var/www/HRMS2/backend/.env
          NODE_ENV: production
          AUDIT_EMAIL: ${{ inputs.email }}
          BRANCH: ${{ inputs.branch }}
        run: npx tsx scripts/probe-noc-pending.ts "${BRANCH}" "$AUDIT_EMAIL"
