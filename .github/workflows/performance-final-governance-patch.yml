name: Performance Final Governance Patch

on:
  push:
    branches:
      - agent/performance-ingestion-platform

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/performance-ingestion-platform
          fetch-depth: 0

      - name: Wire audit migration, guards and UI immutability
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              target = Path(path)
              text = target.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"Required pattern not found in {path}: {old[:100]}")
              target.write_text(text.replace(old, new, 1))

          replace_once(
              "backend/src/db/runPendingMigrations.ts",
              '  "521_performance_multi_source_lineage.sql",\n',
              '  "521_performance_multi_source_lineage.sql",\n  "522_performance_governance_audit.sql",\n',
          )

          replace_once(
              "backend/sql/000_run_all.sql",
              "SOURCE sql/510_portal_superadmin_user.sql;\n",
              "SOURCE sql/510_portal_superadmin_user.sql;\n\n-- ── Governed multi-source performance ingestion (520–522) ───────────────────\nSOURCE sql/520_performance_ingestion_platform.sql;\nSOURCE sql/521_performance_multi_source_lineage.sql;\nSOURCE sql/522_performance_governance_audit.sql;\n",
          )

          replace_once(
              "backend/scripts/performance-ingestion-install.ts",
              '  "521_performance_multi_source_lineage.sql",\n',
              '  "521_performance_multi_source_lineage.sql",\n  "522_performance_governance_audit.sql",\n',
          )
          replace_once(
              "backend/scripts/performance-ingestion-install.ts",
              "         (SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'kpi_metric_master' AND COLUMN_NAME = 'aggregation_method') AS dynamic_metric_column`",
              "         (SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'kpi_metric_master' AND COLUMN_NAME = 'aggregation_method') AS dynamic_metric_column,\n         (SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'performance_governance_audit') AS governance_audit_table`",
          )

          routes = Path("backend/src/modules/performance-ingestion/performance-ingestion.routes.ts")
          text = routes.read_text()
          import_anchor = 'import { performanceGovernanceService } from "./performance-governance.service.js";\n'
          import_block = (
              'import { performanceDatasetMutationGuard } from "./performance-dataset-mutation.guard.js";\n'
              'import { performanceGovernanceAuditMiddleware } from "./performance-governance-audit.middleware.js";\n'
              + import_anchor
          )
          if 'performanceDatasetMutationGuard' not in text:
              if import_anchor not in text:
                  raise SystemExit("Governance service import anchor not found")
              text = text.replace(import_anchor, import_block, 1)
          use_anchor = 'router.use(requireAuth);\n'
          use_block = (
              'router.use(requireAuth);\n'
              'router.use(performanceDatasetMutationGuard);\n'
              'router.use(performanceGovernanceAuditMiddleware);\n'
          )
          if 'router.use(performanceDatasetMutationGuard);' not in text:
              if use_anchor not in text:
                  raise SystemExit("Router auth anchor not found")
              text = text.replace(use_anchor, use_block, 1)
          routes.write_text(text)

          editor = Path("src/components/performance-hub/PerformanceSourceEditor.tsx")
          text = editor.read_text()
          key_anchor = '              id="performance-dataset-key"\n              value={form.datasetKey}\n'
          key_block = '              id="performance-dataset-key"\n              value={form.datasetKey}\n              disabled={editing}\n'
          if 'id="performance-dataset-key"\n              value={form.datasetKey}\n              disabled={editing}' not in text:
              if key_anchor not in text:
                  raise SystemExit("Dataset key input anchor not found")
              text = text.replace(key_anchor, key_block, 1)
          editor.write_text(text)

          workflow = Path(".github/workflows/performance-platform-validation.yml")
          text = workflow.read_text()
          text = text.replace(
              '      - "backend/sql/521_performance_multi_source_lineage.sql"\n',
              '      - "backend/sql/521_performance_multi_source_lineage.sql"\n      - "backend/sql/522_performance_governance_audit.sql"\n',
          )
          workflow.write_text(text)

          test = Path("backend/src/modules/performance-ingestion/__tests__/performance-governance.service.test.ts")
          text = test.read_text()
          marker = '\n});\n'
          addition = '''\n\ndescribe("performance final governance controls", () => {\n  const routeCode = fs.readFileSync(\n    path.resolve(__dirname, "../performance-ingestion.routes.ts"),\n    "utf8",\n  );\n  const guardCode = fs.readFileSync(\n    path.resolve(__dirname, "../performance-dataset-mutation.guard.ts"),\n    "utf8",\n  );\n  const auditCode = fs.readFileSync(\n    path.resolve(__dirname, "../performance-governance-audit.middleware.ts"),\n    "utf8",\n  );\n\n  it("keeps dataset keys immutable and exceptional publication controls admin-only", () => {\n    expect(guardCode).toContain("PERFORMANCE_DATASET_KEY_IMMUTABLE");\n    expect(guardCode).toContain("PERFORMANCE_EXCEPTIONAL_CONTROL_ADMIN_ONLY");\n    expect(guardCode).toContain("allowPartialPublication");\n    expect(guardCode).toContain("allowEmptyPublication");\n  });\n\n  it("audits successful governance mutations with redaction", () => {\n    expect(routeCode).toContain("performanceGovernanceAuditMiddleware");\n    expect(auditCode).toContain("performance_governance_audit");\n    expect(auditCode).toContain("[REDACTED]");\n  });\n});\n'''
          if 'describe("performance final governance controls"' not in text:
              text = text.rstrip() + addition
          test.write_text(text)
          PY

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Final governance patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/src/db/runPendingMigrations.ts \
            backend/sql/000_run_all.sql \
            backend/scripts/performance-ingestion-install.ts \
            backend/src/modules/performance-ingestion/performance-ingestion.routes.ts \
            backend/src/modules/performance-ingestion/__tests__/performance-governance.service.test.ts \
            src/components/performance-hub/PerformanceSourceEditor.tsx \
            .github/workflows/performance-platform-validation.yml
          git commit -m "feat(performance): finalize immutable audited governance"
          git push origin HEAD:agent/performance-ingestion-platform
