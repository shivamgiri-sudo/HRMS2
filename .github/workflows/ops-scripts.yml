              npx tsx scripts/backfill-grn-recognition-period.ts $FLAG
              ;;
            fix-process-branches)
              FLAG=""; [ "$MODE" = "apply" ] && FLAG="--apply"
              npx tsx scripts/fix-process-branches.ts $FLAG
              ;;
            db-bill-snapshot-refresh)
              envv() { grep -m1 "^$1=" /var/www/HRMS2/backend/.env | cut -d= -f2- | sed -e 's/^["'"'"']//' -e 's/["'"'"']$//'; }
              export DB_USER="$(envv DB_USER)" DB_PASSWORD="$(envv DB_PASSWORD)" HRMS_DB_HOST="$(envv DB_HOST)" BILL_DB_HOST="$(envv BILL_DB_HOST)"
              if [ "$MODE" = "apply" ]; then node scripts/sync-db-bill-snapshot.mjs; fi
              node scripts/reconcile-db-bill-snapshot.mjs --hrms-host="$HRMS_DB_HOST" --bill-host="$BILL_DB_HOST"
              ;;
            grn-tally-prod-dryrun) npx tsx scripts/grn-tally-prod-dryrun.ts ;;
            grn-tally-dbbill-probe) npx tsx scripts/grn-tally-dbbill-probe.ts ;;
            repair-migrated-grn-ex-gst)
              FLAG=""; [ "$MODE" = "apply" ] && FLAG="--apply"
              npx tsx scripts/repair-migrated-grn-ex-gst.ts $FLAG
              ;;
            book-nk-to-bluevine)
              FLAG=""; [ "$MODE" = "apply" ] && FLAG="--apply"
              npx tsx scripts/book-nk-to-bluevine.ts $FLAG
              ;;
            grn-migrate-2026-27)
              FLAG=""; [ "$MODE" = "apply" ] && FLAG="--apply"
