name: Ops Scripts (manual)

# Manually-triggered maintenance scripts that must run ON the production host.
#
# ── WHY THIS EXISTS ──────────────────────────────────────────────────────────
# Several one-off scripts cannot run from a developer machine, because the key or the data
# they need only exists on the server:
#
#   FIELD_ENCRYPTION_KEY is set only in /var/www/HRMS2/backend/.env. A backfill run anywhere
#   else silently encrypts production rows with the built-in all-zeros DEV key — the write
#   path never attempts a decrypt, so it reports success and the damage stays invisible until
#   the plaintext is retired. The scripts guard against this themselves (they refuse unless
#   they can decrypt existing ciphertext first), but the guard only helps if the run happens
#   somewhere the real key is present.
#
# The self-hosted runner already sits on that host and already deploys there, so it can run
# them with the production environment and leave an audit trail, without any credential
# changing hands.
#
# ── SAFETY ───────────────────────────────────────────────────────────────────
#   - workflow_dispatch only. Nothing here runs on push, on schedule, or on merge.
#   - Defaults to a dry run. Applying requires typing the script name into `confirm`.
#   - `environment: production` so any GitHub environment protection rules apply.
#   - Serialised: two of these must never overlap on the same tables.
#
# ── THE FLAG TRAP THIS ENCODES ───────────────────────────────────────────────
# The scripts do NOT agree on their default, which is exactly the kind of thing to get wrong
# at 2am on a terminal:
#
#   statutory-identifier-encrypt-backfill.ts   APPLIES unless given --dry-run
#   backup-table-pii-scrub.mjs                 dry-runs unless given --apply
#   legacy-payslip-account-encrypt-backfill    dry-runs unless given --apply
#
# The case statement below maps mode -> the right flag per script, so the operator picks
# "dry-run" or "apply" and never has to remember which way round a given script reads.

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Which script to run"
        required: true
        type: choice
        options:
          - statutory-identifier-encrypt-backfill
          - backup-table-pii-scrub
          - legacy-payslip-account-encrypt-backfill
          - ats-candidate-record-type-backfill
          - ats-candidate-future-date-repair
          - privacy-encryption-verify
          - bank-account-encrypt-backfill
          - resend-address-bgv-links
          - roster-requests-verify
          - sbi-card-verify
          - sbi-card-demo-seed
          - sbi-card-demo-remove
          - holiday-mapping-audit
          - branch-activity-audit
          - ats-candidate-created-date-repair
          - master-duplicate-audit
          - master-duplicate-merge
          - kit-esign-diagnose
          - running-salary-diagnose
          - loan-backfill-duplicate-cancel
          - deduction-duplicates-scan
          - salary-rows-review
          - dbbill-validate-flagged
          - salary-assignment-deactivate-mas63386
          - sal-diff-investigate
          - saldiff-topup-duplicate-reject
          - case-duplicates-scan
          - salary-assignment-dedupe-identical
          - rejoin-stale-exit-audit
          - attendance-register-exited-verify
          - recode-63388c-dryrun
          - recode-63388c-person-check
          - recode-63388c-name-search
          - recode-63388c-attribution
          - recode-63388c-apply
          - recode-63388c-phase2
          - recode-63388c-payroll-check
          - recode-63388c-phase3
          - recode-63388c-compare
          - recode-63388c-phase4
          - recode-63388c-phase5
          - code-lookup-verify
          - code-free-scan-verify
          - code-free-detail-verify
          - dbbill-find-verify
          - hrms-find-verify
          - reconcile-aug-incentives
          - zero-day-gross-audit
          - heal-zero-day-lines
          - apply-aug-increments-from-dbbill
          - salary-package-sources-audit
          - create-missing-esa-for-run-lines
          - employee-components-audit
          - fix-63694c-package
          - align-offers-to-catalog
          - fix-offer-followups
          - salary-change-flow-audit
      mode:
        description: "dry-run reports what it would do and writes nothing"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      merge_masters:
        description: "master-duplicate-merge apply only: comma list of department,designation,branch,process,cost_centre"
        required: false
        type: string
      confirm:
        description: "To APPLY, type the script name exactly. Ignored for a dry run."
        required: false
        type: string

concurrency:
  group: ops-scripts-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    name: "${{ inputs.script }} (${{ inputs.mode }})"
    runs-on: self-hosted
    environment: production
    timeout-minutes: 60

    steps:
      - name: Refuse an unconfirmed apply
        if: inputs.mode == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm }}" != "${{ inputs.script }}" ]; then
            echo "::error::To apply, 'confirm' must be exactly '${{ inputs.script }}'."
            echo "Got: '${{ inputs.confirm }}'"
            exit 1
          fi
          echo "Apply confirmed for ${{ inputs.script }}."

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Verify the production environment file is present
        shell: bash
        run: |
          set -euo pipefail
          ENV_FILE=/var/www/HRMS2/backend/.env
          test -f "$ENV_FILE" || { echo "::error::$ENV_FILE not found — is this the prod host?"; exit 1; }
          # Report only whether the key is set, never its value.
          if grep -q '^FIELD_ENCRYPTION_KEY=' "$ENV_FILE"; then
            echo "FIELD_ENCRYPTION_KEY: present"
          else
            echo "FIELD_ENCRYPTION_KEY: ABSENT — encryption backfills will refuse to run, by design"
          fi

      - name: Run
        working-directory: backend
        shell: bash
        env:
          # dotenv's preloader honours this, and every script here uses `import "dotenv/config"`.
          # Pointing at the deployed .env means the real key is used without copying secrets
          # into the runner workspace.
          DOTENV_CONFIG_PATH: /var/www/HRMS2/backend/.env
          NODE_ENV: production
        run: |
          set -euo pipefail
          MODE="${{ inputs.mode }}"

          case "${{ inputs.script }}" in
            statutory-identifier-encrypt-backfill)
              # Inverted default: this one writes unless told not to.
              FLAG=""; [ "$MODE" = "dry-run" ] && FLAG="--dry-run"
              npx tsx scripts/statutory-identifier-encrypt-backfill.ts $FLAG
              ;;
            backup-table-pii-scrub)
              FLAG=""; [ "$MODE" = "apply" ] && FLAG="--apply"
              node scripts/backup-table-pii-scrub.mjs $FLAG
              ;;
            legacy-payslip-account-encrypt-backfill)
              FLAG=""; [ "$MODE" = "apply" ] && FLAG="--apply"
              node scripts/legacy-payslip-account-encrypt-backfill.mjs $FLAG
              ;;
            ats-candidate-record-type-backfill)
              # dry-runs unless given --apply, like the two above.
              FLAG=""; [ "$MODE" = "apply" ] && FLAG="--apply"
              node scripts/ats-candidate-record-type-backfill.mjs $FLAG
              ;;
            ats-candidate-future-date-repair)
              FLAG=""; [ "$MODE" = "apply" ] && FLAG="--apply"
              node scripts/ats-candidate-future-date-repair.mjs $FLAG
              ;;
            bank-account-encrypt-backfill)
              # INVERTED default, like statutory-identifier: this one WRITES unless given
              # --dry-run. Getting this backwards would encrypt 2,238 rows unasked.
              FLAG=""; [ "$MODE" = "dry-run" ] && FLAG="--dry-run"
              npx tsx scripts/bank-account-encrypt-backfill.ts $FLAG
              ;;
            resend-address-bgv-links)
              # Dry-runs unless given --apply. APPLY EMAILS CANDIDATES, so it refuses to run on a
              # host without SMTP credentials (the mailer would otherwise skip silently).
              FLAG=""; [ "$MODE" = "apply" ] && FLAG="--apply"
              npx tsx scripts/resend-address-bgv-links.ts $FLAG
              ;;
            privacy-encryption-verify)
              # Read-only in both modes — it decrypts and compares, it never writes. Listed here
              # because it needs the production key, and it is the gate on the reader migration:
              # a column whose ciphertext does not match its plaintext must not have its
              # plaintext retired.
              npx tsx scripts/privacy-encryption-verify.ts
              ;;
            roster-requests-verify)
              # Read-only: SELECTs only, in a READ ONLY session. Checks the Roster Requests hub
              # tables (migration 1995), their schema_migrations row, row counts, collations and
              # counterpart_status. It has no apply mode, so apply is refused here and by the script.
              if [ "$MODE" = "apply" ]; then
                echo "::error::roster-requests-verify is read-only; run it with mode=dry-run."
                exit 1
              fi
              node scripts/roster-requests-verify.mjs
              ;;
            hrms-find-verify)
              # Read-only: find an employee in HRMS by name variants or code fragment and show whether db_bill has the code. No apply mode.
              if [ "$MODE" = "apply" ]; then
                echo "::error::hrms-find-verify is read-only; run it with mode=dry-run."
                exit 1
              fi
              npx tsx scripts/hrms-find-verify.ts
              ;;
            dbbill-find-verify)
              # Read-only: find an employee in db_bill by name or code fragment and show whether HRMS has that code. No apply mode.
              if [ "$MODE" = "apply" ]; then
                echo "::error::dbbill-find-verify is read-only; run it with mode=dry-run."
                exit 1
              fi
              npx tsx scripts/dbbill-find-verify.ts
              ;;
            code-free-detail-verify)
              # Read-only: dates/statuses of the rows holding MAS63449 in the tables the scan hit. No apply mode.
              if [ "$MODE" = "apply" ]; then
                echo "::error::code-free-detail-verify is read-only; run it with mode=dry-run."
                exit 1
              fi
              npx tsx scripts/code-free-detail-verify.ts
              ;;
            code-free-scan-verify)
              # Read-only: scan every code-like column in HRMS and db_bill for one employee code. No apply mode.
              if [ "$MODE" = "apply" ]; then
                echo "::error::code-free-scan-verify is read-only; run it with mode=dry-run."
                exit 1
              fi
              npx tsx scripts/code-free-scan-verify.ts MAS63449
              ;;
            code-lookup-verify)
              # Read-only: one employee code in HRMS and db_bill (record, dates, status, same-PAN/Aadhaar siblings). No apply mode.
              if [ "$MODE" = "apply" ]; then
                echo "::error::code-lookup-verify is read-only; run it with mode=dry-run."
                exit 1
              fi
              npx tsx scripts/code-lookup-verify.ts MAS63449
              ;;
            recode-63388c-phase5)
              # PHASE 5 of the 63388C clash: copy Tina's db_bill qualification to employee_education. dry-run writes nothing.
              FLAG=""; [ "$MODE" = "apply" ] && FLAG="--apply"
              npx tsx scripts/recode-63388c-phase5.ts $FLAG
              ;;
            recode-63388c-phase4)
              # PHASE 4 of the 63388C clash: re-code Talabhai's ATS candidate/bridge rows to 63388C-OLD. dry-run writes nothing.
              FLAG=""; [ "$MODE" = "apply" ] && FLAG="--apply"
              npx tsx scripts/recode-63388c-phase4.ts $FLAG
              ;;
            recode-63388c-compare)
              # Read-only: field compare HRMS 63388C vs db_bill, plus dates of the code-text rows. No apply mode.
              if [ "$MODE" = "apply" ]; then
                echo "::error::recode-63388c-compare is read-only; run it with mode=dry-run."
                exit 1
              fi
              npx tsx scripts/recode-63388c-compare.ts
              ;;
            recode-63388c-phase3)
              # PHASE 3 of the 63388C clash: re-point Tina's August payroll line from Talabhai to her. dry-run writes nothing.
              FLAG=""; [ "$MODE" = "apply" ] && FLAG="--apply"
              npx tsx scripts/recode-63388c-phase3.ts $FLAG
              ;;
            recode-63388c-payroll-check)
              # Read-only: August payroll lines for both 63388C people vs db_bill salary_data. No apply mode.
              if [ "$MODE" = "apply" ]; then
                echo "::error::recode-63388c-payroll-check is read-only; run it with mode=dry-run."
                exit 1
              fi
              npx tsx scripts/recode-63388c-payroll-check.ts
              ;;
            recode-63388c-phase2)
              # PHASE 2 of the 63388C clash: Tina's salary package and attendance from db_bill. dry-run writes nothing.
              FLAG=""; [ "$MODE" = "apply" ] && FLAG="--apply"
              npx tsx scripts/recode-63388c-phase2.ts $FLAG
              ;;
            recode-63388c-apply)
              # PHASE 1 of the 63388C code clash. dry-run prints the plan and writes nothing; apply re-codes the HRMS
              # employee to 63388C-OLD and creates the db_bill employee as 63388C. Apply needs the typed confirm above.
              FLAG=""; [ "$MODE" = "apply" ] && FLAG="--apply"
              npx tsx scripts/recode-63388c-apply.ts $FLAG
              ;;
            recode-63388c-attribution)
              # Read-only: date bands and counts per table to attribute 63388C rows to one person or the other. No apply mode.
              if [ "$MODE" = "apply" ]; then
                echo "::error::recode-63388c-attribution is read-only; run it with mode=dry-run."
                exit 1
              fi
              npx tsx scripts/recode-63388c-attribution.ts
              ;;
            recode-63388c-name-search)
              # Read-only: name / DOB+mobile-last4 search across db_bill and HRMS for the two 63388C people. No apply mode.
              if [ "$MODE" = "apply" ]; then
                echo "::error::recode-63388c-name-search is read-only; run it with mode=dry-run."
                exit 1
              fi
              npx tsx scripts/recode-63388c-name-search.ts
              ;;
            recode-63388c-person-check)
              # Read-only: compares the HRMS and db_bill 63388C records (name/DOB/last-4 only) and post-exit activity. No apply mode.
              if [ "$MODE" = "apply" ]; then
                echo "::error::recode-63388c-person-check is read-only; run it with mode=dry-run."
                exit 1
              fi
              npx tsx scripts/recode-63388c-person-check.ts
              ;;
            recode-63388c-dryrun)
              # Read-only inventory for the 63388C code clash: counts of rows per table in HRMS and db_bill. No apply mode.
              if [ "$MODE" = "apply" ]; then
                echo "::error::recode-63388c-dryrun is read-only; run it with mode=dry-run."
                exit 1
              fi
              npx tsx scripts/recode-63388c-dryrun.ts
              ;;
            attendance-register-exited-verify)
              # Read-only: SELECTs plus the register executor. Lists inactive employees who exited in the month and
              # checks each appears in the Attendance Register. No apply mode.
              if [ "$MODE" = "apply" ]; then
                echo "::error::attendance-register-exited-verify is read-only; run it with mode=dry-run."
                exit 1
              fi
              npx tsx scripts/attendance-register-exited-verify.ts
              ;;
            sbi-card-verify)
              # Read-only: SELECTs only, in a READ ONLY session. Checks the SBI Card collections-ops migration (2075): the agent-time
              # table, the account-file columns and flow key, the schema_migrations row and the upload templates. No apply mode.
              if [ "$MODE" = "apply" ]; then
                echo "::error::sbi-card-verify is read-only; run it with mode=dry-run."
                exit 1
              fi
              node scripts/sbi-card-verify.mjs
              ;;
            sbi-card-demo-seed|sbi-card-demo-remove)
              # Synthetic SBI Card dashboard data, tagged data_source='DEMO_SEED' so it can be removed exactly. dry-run reports only;
              # apply writes (seed) or deletes the tagged rows (remove). Refuses to seed over real rows for the demo's dates.
              SUB="seed"; [ "${{ inputs.script }}" = "sbi-card-demo-remove" ] && SUB="remove"
              if [ "$MODE" = "dry-run" ]; then SUB="dry-run"; fi
              npx tsx scripts/sbi-card-demo-seed.ts --mode=$SUB
              ;;
            holiday-mapping-audit)
              # Read-only in both modes.
              npx tsx scripts/holiday-mapping-audit.ts 2026-10-02
              ;;
            kit-esign-diagnose)
              # Read-only in both modes: SELECTs only.
              npx tsx scripts/kit-esign-diagnose.ts MAS63661
              ;;
            running-salary-diagnose)
              # Read-only in both modes: SELECTs and a pure calculation, no writes.
              npx tsx scripts/running-salary-diagnose.ts MAS47814
              ;;
            loan-backfill-duplicate-cancel)
              # Dry-runs unless given --apply. Apply cancels (soft) only exact duplicates of a synced loan.
              FLAG=""; [ "$MODE" = "apply" ] && FLAG="--apply"
              npx tsx scripts/loan-backfill-duplicate-cancel.ts $FLAG
              ;;
            deduction-duplicates-scan)
              # Read-only in both modes: SELECTs only.
              npx tsx scripts/deduction-duplicates-scan.ts
              ;;
            salary-rows-review)
              # Read-only in both modes: SELECTs only.
              npx tsx scripts/salary-rows-review.ts
              ;;
            dbbill-validate-flagged)
              # Read-only in both modes: SELECTs against HRMS and db_bill only.
              npx tsx scripts/dbbill-validate-flagged.ts
              ;;
            salary-assignment-deactivate-mas63386)
              # Dry-runs unless given --apply. Apply deactivates ONE guarded row (active_status 1 -> 0).
              FLAG=""; [ "$MODE" = "apply" ] && FLAG="--apply"
              npx tsx scripts/salary-assignment-deactivate-mas63386.ts $FLAG
              ;;
            sal-diff-investigate)
              # Read-only in both modes: SELECTs against HRMS and db_bill only.
              npx tsx scripts/sal-diff-investigate.ts
              ;;
            salary-change-flow-audit)
              # Read-only in both modes: SELECTs only.
              npx tsx scripts/salary-change-flow-audit.ts
              ;;
            fix-offer-followups)
              # Dry-runs unless given --apply. Apply inserts/supersedes/corrects package rows for approved offers that match one catalog package.
              FLAG=""; [ "$MODE" = "apply" ] && FLAG="--apply"
              npx tsx scripts/fix-offer-followups.ts $FLAG
              ;;
            align-offers-to-catalog)
              # Dry-runs unless given --apply. Apply repairs only offers with no salary line yet; the rest are listed.
              FLAG=""; [ "$MODE" = "apply" ] && FLAG="--apply"
              npx tsx scripts/align-offers-to-catalog.ts $FLAG
              ;;
            fix-63694c-package)
              # Dry-runs unless given --apply. Apply corrects one employee's package row, offer and joining validation in one transaction.
              FLAG=""; [ "$MODE" = "apply" ] && FLAG="--apply"
              npx tsx scripts/fix-63694c-package.ts $FLAG
              ;;
            employee-components-audit)
              # Read-only in both modes: SELECTs only. Fixed employee: 63694C.
              npx tsx scripts/employee-components-audit.ts 63694C
              ;;
            create-missing-esa-for-run-lines)
              # Dry-runs unless given --apply. Apply inserts the esa row the engine needs; no existing line is changed.
              FLAG=""; [ "$MODE" = "apply" ] && FLAG="--apply"
              npx tsx scripts/create-missing-esa-for-run-lines.ts $FLAG
              ;;
            salary-package-sources-audit)
              # Read-only in both modes: SELECTs only. Fixed list of the 10 employees whose package was written on 2026-10-04.
              npx tsx scripts/salary-package-sources-audit.ts MAS63686 MAS63665 MAS63653 MAS63460 MAS63650 MAS63649 MAS63652 MAS63314 MAS63432 MAS63085
              ;;
            apply-aug-increments-from-dbbill)
              # Dry-runs unless given --apply. Apply supersedes + inserts the db_bill package for employees whose
              # latest db_bill row is in the month and differs, then recalculates exactly those lines.
              FLAG=""; [ "$MODE" = "apply" ] && FLAG="--apply"
              npx tsx scripts/apply-aug-increments-from-dbbill.ts $FLAG
              ;;
            heal-zero-day-lines)
              # Dry-runs unless given --apply. Apply removes not-yet-joined zero-net lines and recalculates the rest, scoped.
              FLAG=""; [ "$MODE" = "apply" ] && FLAG="--apply"
              npx tsx scripts/heal-zero-day-lines.ts $FLAG
              ;;
            zero-day-gross-audit)
              # Read-only in both modes: SELECTs only.
              npx tsx scripts/zero-day-gross-audit.ts
              ;;
            reconcile-aug-incentives)
              # Dry-runs unless given --apply. Apply rejects the duplicate AHMJD batch and adds top-up lines (one transaction).
              FLAG=""; [ "$MODE" = "apply" ] && FLAG="--apply"
              npx tsx scripts/reconcile-aug-incentives.ts $FLAG
              ;;
            saldiff-topup-duplicate-reject)
              # Dry-runs unless given --apply. Apply MOVES 3 guarded lines into a rejected batch (nothing deleted).
              FLAG=""; [ "$MODE" = "apply" ] && FLAG="--apply"
              npx tsx scripts/saldiff-topup-duplicate-reject.ts $FLAG
              ;;
            master-duplicate-merge)
              # Transactional. dry-run rolls back after running the real statements; apply is
              # limited to the masters named in MASTERS below and commits only with zero errors.
              if [ "$MODE" = "apply" ]; then
                npx tsx scripts/master-duplicate-merge.ts --masters="${{ inputs.merge_masters }}" --apply
              else
                npx tsx scripts/master-duplicate-merge.ts
              fi
              ;;
            master-duplicate-audit)
              # Read-only in both modes.
              npx tsx scripts/master-duplicate-audit.ts
              ;;
            case-duplicates-scan)
              # Read-only in both modes: SELECTs only.
              npx tsx scripts/case-duplicates-scan.ts
              ;;
            salary-assignment-dedupe-identical)
              # Dry-runs unless given --apply. Apply deactivates the later of two IDENTICAL active rows (soft).
              FLAG=""; [ "$MODE" = "apply" ] && FLAG="--apply"
              npx tsx scripts/salary-assignment-dedupe-identical.ts $FLAG
              ;;
            rejoin-stale-exit-audit)
              # Read-only in both modes: SELECTs only, employee_code only in the output.
              npx tsx scripts/rejoin-stale-exit-audit.ts
              ;;
            branch-activity-audit)
              # Read-only in both modes.
              npx tsx scripts/branch-activity-audit.ts 2026-10-03 NOIDA-2
              ;;
            ats-candidate-created-date-repair)
              # dry-runs unless given --apply.
              FLAG=""; [ "$MODE" = "apply" ] && FLAG="--apply"
              node scripts/ats-candidate-created-date-repair.mjs $FLAG
              ;;
            *)
              echo "::error::Unknown script '${{ inputs.script }}'"
              exit 1
              ;;
          esac

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### ${{ inputs.script }}"
            echo ""
            echo "- mode: **${{ inputs.mode }}**"
            echo "- commit: \`${{ github.sha }}\`"
            echo "- actor: @${{ github.actor }}"
          } >> "$GITHUB_STEP_SUMMARY"
