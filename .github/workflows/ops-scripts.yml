            fix-gst-credit-note-roundoff|fix-legacy-false-paid-grns|fix-grn-status-from-tracking)
              FLAG=""; [ "$MODE" = "apply" ] && FLAG="--apply"
              npx tsx scripts/${{ inputs.script }}.ts $FLAG
