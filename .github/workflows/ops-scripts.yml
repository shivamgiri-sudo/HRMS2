name: Ops Scripts (manual)

# Manually-triggered maintenance scripts that must run ON the production host.
#
# ── WHY THIS EXISTS ──────────────────────────────────────────────────────────
# Several one-off scripts cannot run from a developer machine, because the key or the data
# they need only exists on the server:
#
#   FIELD_ENCRYPTION_KEY is set only in /var/www/HRMS2/backend/.env. A backfill run anywhere
#   else silently encrypts production rows with the built-in all-zeros DEV key — the write
#   path never attempts a decrypt, so it reports success and the damage stays invisible until
#   the plaintext is retired. The scripts guard against this themselves (they refuse unless
#   they can decrypt existing ciphertext first), but the guard only helps if the run happens
#   somewhere the real key is present.
#
# The self-hosted runner already sits on that host and already deploys there, so it can run
# them with the production environment and leave an audit trail, without any credential
# changing hands.
#
# ── SAFETY ───────────────────────────────────────────────────────────────────
#   - workflow_dispatch only. Nothing here runs on push, on schedule, or on merge.
#   - Defaults to a dry run. Applying requires typing the script name into `confirm`.
#   - `environment: production` so any GitHub environment protection rules apply.
#   - Serialised: two of these must never overlap on the same tables.
#
# ── THE FLAG TRAP THIS ENCODES ───────────────────────────────────────────────
# The scripts do NOT agree on their default, which is exactly the kind of thing to get wrong
# at 2am on a terminal:
#
#   statutory-identifier-encrypt-backfill.ts   APPLIES unless given --dry-run
#   backup-table-pii-scrub.mjs                 dry-runs unless given --apply
#   legacy-payslip-account-encrypt-backfill    dry-runs unless given --apply
#
# The case statement below maps mode -> the right flag per script, so the operator picks
# "dry-run" or "apply" and never has to remember which way round a given script reads.

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Which script to run"
        required: true
        type: choice
        options:
          - statutory-identifier-encrypt-backfill
          - backup-table-pii-scrub
          - legacy-payslip-account-encrypt-backfill
          - ats-candidate-record-type-backfill
          - ats-candidate-future-date-repair
          - privacy-encryption-verify
          - bank-account-encrypt-backfill
          - resend-address-bgv-links
          - roster-requests-verify
          - bla-uploader-diagnose
          - report-requests-diagnose
          - payment-voucher-salary-verify
          - sbi-card-verify
          - sbi-card-demo-seed
          - sbi-card-demo-remove
          - holiday-mapping-audit
          - exception-control-audit
          - payable-days-check
          - repair-bucket-regrade
          - meta-outreach-audit
          - apr-source-audit
          - branch-activity-audit
          - ats-candidate-created-date-repair
          - branch-activity-resend-noida2
          - master-duplicate-audit
          - master-duplicate-merge
          - kit-esign-diagnose
          - bank-verify-diagnose
          - bank-verify-rejudge
          - bank-verified-copy
          - process-scope-diagnose
          - process-code-search
          - ops-nudge-stats
          - ops-pending-audit
          - ops-pending-evidence
          - ops-pending-person
          - esi-person-check
          - bank-manual-approve
          - digilocker-pending-diagnose
          - digilocker-sync-pending
          - digilocker-bridge-backfill
          - alt-rx-apply
          - ahm-apply
          - running-salary-diagnose
          - loan-backfill-duplicate-cancel
          - deduction-duplicates-scan
          - salary-rows-review
          - dbbill-validate-flagged
          - salary-assignment-deactivate-mas63386
          - sal-diff-investigate
          - saldiff-topup-duplicate-reject
          - case-duplicates-scan
          - salary-assignment-dedupe-identical
          - rejoin-stale-exit-audit
          - attendance-register-exited-verify
          - reconcile-aug-incentives
          - zero-day-gross-audit
          - aug-payroll-vs-dbbill-gap
          - match-month-to-dbbill
          - vendor-ledger-gap-audit
          - vendor-ledger-tally-audit
          - trial-balance-timing
          - tally-reports-validate
          - tally-gaps-detail
          - unposted-grn-diagnose
          - fix-gst-credit-note-roundoff
          - backfill-grn-journal
          - voucher-unassigned-detail
          - unposted-grn-forensics
          - duplicate-grn-forensics
          - grn-pair-deepdive
          - grn-false-paid-audit
          - grn-split-children-check
          - fix-legacy-false-paid-grns
          - grn-status-check
          - fix-grn-status-from-tracking
          - grn-status-mismatch-detail
          - vendor-bills-journal-vs-tracking
          - heal-zero-day-lines
          - recruiter-list-diagnose
          - budget-driver-diagnose
          - payslip-diagnose
          - meta-whatsapp-diagnose
          - he-inbox-timing
          - backend-log-grep
          - apply-aug-increments-from-dbbill
          - salary-package-sources-audit
          - create-missing-esa-for-run-lines
          - employee-components-audit
          - fix-63694c-package
          - align-offers-to-catalog
          - fix-offer-followups
          - salary-change-flow-audit
          - package-in-force-diff
          - increment-split-what-if
          - increment-requests-audit
          - dbbill-increments-audit
          - sca-estimates-audit
          - repair-sca-estimates
          - du-mis-apply
          - mis-schedule-run-now
          - mis-report-schedules-setup
          - backfill-vendor-recognition-period
          - backfill-grn-recognition-period
          - fix-process-branches
          - db-bill-snapshot-refresh
          - grn-migrate-2026-27
          - book-nk-to-bluevine
          - repair-migrated-grn-ex-gst
          - grn-tally-prod-dryrun
          - grn-tally-dbbill-probe

      mode:
        description: "dry-run reports what it would do and writes nothing"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      merge_masters:
        description: "master-duplicate-merge apply only: comma list of department,designation,branch,process,cost_centre"
        required: false
        type: string
      employee_codes:
        description: "employee-components-audit only: space-separated employee codes (default 63694C)"
        required: false
        default: ""
        type: string
      confirm:
        description: "To APPLY, type the script name exactly. Ignored for a dry run."
        required: false
        type: string

concurrency:
  group: ops-scripts-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    name: "${{ inputs.script }} (${{ inputs.mode }})"
    runs-on: self-hosted
    environment: production
    timeout-minutes: 60

    steps:
      - name: Refuse an unconfirmed apply
        if: inputs.mode == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm }}" != "${{ inputs.script }}" ]; then
            echo "::error::To apply, 'confirm' must be exactly '${{ inputs.script }}'."
            echo "Got: '${{ inputs.confirm }}'"
            exit 1
          fi
          echo "Apply confirmed for ${{ inputs.script }}."

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Verify the production environment file is present
        shell: bash
        run: |
          set -euo pipefail
          ENV_FILE=/var/www/HRMS2/backend/.env
          test -f "$ENV_FILE" || { echo "::error::$ENV_FILE not found — is this the prod host?"; exit 1; }
          # Report only whether the key is set, never its value.
          if grep -q '^FIELD_ENCRYPTION_KEY=' "$ENV_FILE"; then
            echo "FIELD_ENCRYPTION_KEY: present"
          else
            echo "FIELD_ENCRYPTION_KEY: ABSENT — encryption backfills will refuse to run, by design"
          fi

      - name: Run
        working-directory: backend
        shell: bash
        env:
          # dotenv's preloader honours this, and every script here uses `import "dotenv/config"`.
          # Pointing at the deployed .env means the real key is used without copying secrets
          # into the runner workspace.
          DOTENV_CONFIG_PATH: /var/www/HRMS2/backend/.env
          NODE_ENV: production
          INPUT_EMPLOYEE_CODES: ${{ inputs.employee_codes }}
        run: |
          set -euo pipefail
          MODE="${{ inputs.mode }}"

          case "${{ inputs.script }}" in
            statutory-identifier-encrypt-backfill)
              FLAG=""; [ "$MODE" = "dry-run" ] && FLAG="--dry-run"
              npx tsx scripts/statutory-identifier-encrypt-backfill.ts $FLAG
              ;;
            backup-table-pii-scrub)
              FLAG=""; [ "$MODE" = "apply" ] && FLAG="--apply"
              node scripts/backup-table-pii-scrub.mjs $FLAG
              ;;
            legacy-payslip-account-encrypt-backfill)
              FLAG=""; [ "$MODE" = "apply" ] && FLAG="--apply"
              node scripts/legacy-payslip-account-encrypt-backfill.mjs $FLAG
              ;;
            ats-candidate-record-type-backfill)
              FLAG=""; [ "$MODE" = "apply" ] && FLAG="--apply"
              node scripts/ats-candidate-record-type-backfill.mjs $FLAG
              ;;
            ats-candidate-future-date-repair)
              FLAG=""; [ "$MODE" = "apply" ] && FLAG="--apply"
              node scripts/ats-candidate-future-date-repair.mjs $FLAG
              ;;
            bank-account-encrypt-backfill)
              FLAG=""; [ "$MODE" = "dry-run" ] && FLAG="--dry-run"
              npx tsx scripts/bank-account-encrypt-backfill.ts $FLAG
              ;;
            resend-address-bgv-links)
              FLAG=""; [ "$MODE" = "apply" ] && FLAG="--apply"
              npx tsx scripts/resend-address-bgv-links.ts $FLAG
              ;;
            privacy-encryption-verify)
              npx tsx scripts/privacy-encryption-verify.ts
              ;;
            payment-voucher-salary-verify)
              FLAG=""; [ "$MODE" = "apply" ] && FLAG="--apply"
              node scripts/payment-voucher-salary-verify.mjs $FLAG
              ;;
            report-requests-diagnose)
              if [ "$MODE" = "apply" ]; then
                echo "::error::report-requests-diagnose is read-only; run it with mode=dry-run."
                exit 1
              fi
              node scripts/report-requests-diagnose.mjs
              ;;
            bla-uploader-diagnose) node scripts/bla-uploader-diagnose.mjs ;; # read-only (SELECTs in a READ ONLY session)
            roster-requests-verify)
              if [ "$MODE" = "apply" ]; then
                echo "::error::roster-requests-verify is read-only; run it with mode=dry-run."
                exit 1
              fi
              node scripts/roster-requests-verify.mjs
              ;;
            attendance-register-exited-verify)
              if [ "$MODE" = "apply" ]; then
                echo "::error::attendance-register-exited-verify is read-only; run it with mode=dry-run."
                exit 1
              fi
              npx tsx scripts/attendance-register-exited-verify.ts
              ;;
            sbi-card-verify)
              if [ "$MODE" = "apply" ]; then
                echo "::error::sbi-card-verify is read-only; run it with mode=dry-run."
                exit 1
              fi
              node scripts/sbi-card-verify.mjs
              ;;
            sbi-card-demo-seed|sbi-card-demo-remove)
              SUB="seed"; [ "${{ inputs.script }}" = "sbi-card-demo-remove" ] && SUB="remove"
              if [ "$MODE" = "dry-run" ]; then SUB="dry-run"; fi
              npx tsx scripts/sbi-card-demo-seed.ts --mode=$SUB
