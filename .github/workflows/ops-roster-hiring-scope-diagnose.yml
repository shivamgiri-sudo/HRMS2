name: Ops Roster+Hiring Scope Diagnose (manual, read-only)

#

on:
  workflow_dispatch:

concurrency:
  group: ops-roster-hiring-scope-diagnose-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    name: Branch scope + hiring entry counts
    runs-on: self-hosted
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Run
        working-directory: backend
        shell: bash
        env:
          DOTENV_CONFIG_PATH: /var/www/HRMS2/backend/.env
          NODE_ENV: production
        run: |
          set -euo pipefail
          test -f "$DOTENV_CONFIG_PATH" || { echo "::error::$DOTENV_CONFIG_PATH not found"; exit 1; }
          npx tsx scripts/roster-hiring-scope-diagnose.ts Ahmedabad
