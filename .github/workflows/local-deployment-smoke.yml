name: Local Deployment Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - "e2e/**"
      - "src/**"
      - "backend/**"
      - ".github/workflows/local-deployment-smoke.yml"

jobs:
  smoke:
    name: Build, migrate, seed, login and browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          # MYSQL_DATABASE is deliberately NOT set. The container would create mas_hrms with
          # the server default collation (utf8mb4_0900_ai_ci on MySQL 8.0), after which the
          # runner's CREATE DATABASE IF NOT EXISTS ... COLLATE utf8mb4_unicode_ci becomes a
          # silent no-op — and migration 018 fails on an incompatible foreign key seventeen
          # migrations later. Letting the migration runner create the database is also what a
          # real fresh deployment does, so this job now exercises that path instead of a
          # pre-provisioned one that never matched it.
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    env:
      # Opt into the future GitHub JavaScript action runtime now.
      # Project runtime is still controlled by setup-node below.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

      NODE_ENV: development
      PORT: 5055
      FRONTEND_URL: http://localhost:8080
      ACTIVE_DB_PROVIDER: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpass
      DB_NAME: mas_hrms
      DB_POOL_MAX: 10
      JWT_SECRET: local-ci-jwt-secret-minimum-32-characters
      PORTAL_JWT_SECRET: local-ci-portal-secret-minimum-32-characters
      # seed-demo-auth.ts refuses to run without this and requires 12+ characters. It sets the
      # SAME password on every demo account, so the login check below must use it too rather
      # than the three different per-account passwords it used to assume.
      DEMO_AUTH_PASSWORD: local-ci-demo-password-2026
      # Must be a 64-character hex string — env validation rejects anything else and the
      # backend then exits before binding a listener. An earlier attempt here used a readable
      # passphrase and took the whole run down; the health poll correctly reported it as a
      # boot failure rather than a schema problem, which is what that split is for.
      #
      # Silences the startup warning that external-DB connector credentials would otherwise be
      # encrypted with an all-zero key. Nothing in this job connects to a real source system,
      # but a warning present in every run is a warning nobody reads.
      ENCRYPTION_KEY: "00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff"
      PAYROLL_BANK_KEY: local-ci-bank-key-32-characters
      COMM_SECRET: local-ci-comm-secret-32-characters
      ENABLE_SCHEDULERS: "false"
      SEED_DEMO_DATA: "false"
      LEGACY_SYNC_ENABLED: "false"
      PORTAL_DEMO_BYPASS: "false"
      INTERNAL_DEMO_BYPASS: "false"
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: noreply@example.com
      SMTP_FROM_NAME: MAS Callnet HRMS
      NCOSEC_DB_HOST: ""
      NCOSEC_DB_PORT: 1433
      NCOSEC_DB_USER: ""
      NCOSEC_DB_PASSWORD: ""
      NCOSEC_DB_NAME: NCOSEC
      NCOSEC_DB_ENCRYPT: "false"
      DIALER_DB_HOST: ""
      DIALER_DB_PORT: 3306
      DIALER_DB_USER: ""
      DIALER_DB_PASSWORD: ""
      DIALER_DB_NAME: ""

      VITE_HRMS_API_URL: http://localhost:5055
      VITE_ENABLE_DEMO_LOGIN: "true"
      PLAYWRIGHT_BASE_URL: http://localhost:8080

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Backend typecheck
        working-directory: backend
        run: |
          echo "::group::Backend typecheck"
          npm run typecheck
          echo "::endgroup::"

      - name: Backend build
        working-directory: backend
        run: |
          echo "::group::Backend build"
          npm run build
          echo "::endgroup::"

      - name: Frontend build
        run: |
          echo "::group::Frontend build"
          npm run build
          echo "::endgroup::"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # The database has to exist, with the right collation, before anything connects to it.
      #
      # Letting the migration runner create it (by dropping MYSQL_DATABASE from the service
      # container) got the collation right but broke boot ordering: modules like the
      # reimbursements table-ensure connect to mas_hrms during startup, before
      # runPendingMigrations() reaches ensureDatabaseExists, and the backend died with
      # "Unknown database 'mas_hrms'" before binding a listener.
      #
      # Letting the container create it (MYSQL_DATABASE: mas_hrms) got the ordering right but
      # the collation wrong — the image uses the server default, utf8mb4_0900_ai_ci on MySQL
      # 8.0, and GitHub service containers give no way to pass --collation-server.
      #
      # So do it explicitly here: correct collation AND before any consumer starts. The
      # runner's own assertion in ensureDatabaseExists still verifies it, so if this step is
      # ever removed or changed the migration run says so in one clear line rather than
      # failing on a foreign key seventeen migrations later.
      - name: Create database with the required collation
        working-directory: backend
        run: |
          echo "::group::Create database"
          node -e "
          const mysql = require('mysql2/promise');
          (async () => {
            const conn = await mysql.createConnection({
              host: '127.0.0.1', port: 3306, user: 'root', password: 'rootpass',
            });
            await conn.query(
              'CREATE DATABASE IF NOT EXISTS \`mas_hrms\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
            );
            const [rows] = await conn.query(
              \"SELECT DEFAULT_COLLATION_NAME c FROM information_schema.SCHEMATA WHERE SCHEMA_NAME='mas_hrms'\"
            );
            console.log('mas_hrms collation:', rows[0].c);
            if (rows[0].c !== 'utf8mb4_unicode_ci') process.exit(1);
            await conn.end();
          })().catch((e) => { console.error(e); process.exit(1); });
          "
          echo "::endgroup::"

      - name: Start backend and run migrations
        working-directory: backend
        run: |
          npm start > ../backend-smoke.log 2>&1 &
          echo $! > ../backend-smoke.pid

      # Why this step used to be unpassable:
      #
      # It polled /api/health for `json.db === 'ok'` and `json.migrations.status === 'ok'`.
      # That endpoint returns neither field and never has in this form — health.routes.ts
      # is deliberately hardened to expose only {success, service, status, timestamp} to
      # unauthenticated callers, precisely so migration failures are not readable from the
      # internet. The poll therefore waited out its full 120 s on every run and the job had
      # never once reached the browser stage.
      #
      # The assertions were not wrong, only unreachable at that endpoint. GET /api/health
      # already returns 200 if and only if `dbStatus === "ok" && schemaStatus.valid`, so a
      # 200 proves both things the old poll was trying to read. The detail it wanted lives
      # behind auth at /api/health/readiness, which is fetched below once we have an admin
      # token — so the evidence is stronger than before without weakening the public probe.
      - name: Wait for backend health
        run: |
          echo "::group::Backend health"
          node - <<'NODE'
          const fs = require('node:fs');
          const deadline = Date.now() + 120000;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          function dumpBackendLog() {
            try {
              console.error('\n----- backend-smoke.log -----');
              console.error(fs.readFileSync('backend-smoke.log', 'utf8').slice(-12000));
              console.error('----- end backend-smoke.log -----\n');
            } catch (error) {
              console.error('Could not read backend-smoke.log:', error instanceof Error ? error.message : String(error));
            }
          }

          // Separating liveness from readiness is the difference between "the process never
          // started" and "the process started but the schema is behind" — two failures with
          // completely different owners that the old single poll reported identically.
          async function probe(path) {
            const res = await fetch('http://localhost:5055' + path);
            return { status: res.status, body: (await res.text()).slice(0, 400) };
          }

          async function main() {
            let last = 'no response yet';
            let sawLive = false;
            let attempt = 0;

            while (Date.now() < deadline) {
              attempt++;
              try {
                if (!sawLive) {
                  const live = await probe('/api/health/live');
                  if (live.status === 200) {
                    sawLive = true;
                    console.log('  process is alive (attempt ' + attempt + ')');
                  }
                }

                const health = await probe('/api/health');
                if (health.status === 200) {
                  console.log('Backend healthy after ' + attempt + ' attempt(s).');
                  console.log('  GET /api/health -> 200, which the route returns only when the');
                  console.log('  DB ping succeeds and schema verification reports no pending migrations.');
                  return;
                }
                last = 'HTTP ' + health.status + ' ' + health.body;
                console.log('  attempt ' + attempt + ': ' + last);
              } catch (error) {
                last = error instanceof Error ? error.message : String(error);
                console.log('  attempt ' + attempt + ': ' + last);
              }
              await sleep(3000);
            }

            if (sawLive) {
              console.error('Backend process is running but never became healthy within 120 s.');
              console.error('/api/health returns 503 when the DB ping fails OR migrations are pending.');
              console.error('Check the migration output in the log below to tell which.');
            } else {
              console.error('Backend process never answered /api/health/live within 120 s.');
              console.error('It failed before binding a listener — look for a boot exception below.');
            }
            console.error('Last response/error: ' + last);
            dumpBackendLog();
            process.exit(1);
          }

          main();
          NODE
          echo "::endgroup::"

      - name: Seed demo auth users
        working-directory: backend
        run: |
          echo "::group::Seed demo auth"
          npm run seed:demo
          echo "::endgroup::"

      - name: Validate demo logins
        run: |
          echo "::group::Validate API logins"
          node - <<'NODE'
          const fs = require('node:fs');
          // seed-demo-auth.ts hashes DEMO_AUTH_PASSWORD onto every demo account, so all three
          // share it. The three different literals that used to be here could never have
          // matched what the seeder wrote — this step has never run, because the health poll
          // above it never passed.
          const password = process.env.DEMO_AUTH_PASSWORD;
          if (!password) throw new Error('DEMO_AUTH_PASSWORD is not set; the seed step cannot have run');
          const users = [
            ['admin@mascallnet.com', password],
            ['hr@mascallnet.com',    password],
            ['tl@mascallnet.com',    password],
          ];

          async function login(identifier, password) {
            const res = await fetch('http://localhost:5055/api/auth/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ identifier, password }),
            });
            const text = await res.text();
            if (!res.ok) throw new Error(identifier + ' login failed: HTTP ' + res.status + ' ' + text);
            const json = JSON.parse(text);
            const data = json?.data ?? {};

            if (!data.accessToken) {
              throw new Error(identifier + ' login returned no access token: ' + text);
            }

            // refreshToken is deliberately null when 2FA is outstanding — issuing one before
            // the second factor is exactly the bypass auth-security.test.ts guards against.
            // Demanding a refresh token unconditionally, as this step used to, would fail on a
            // correctly hardened login and pass on a broken one. So assert the rule, not the
            // presence of a field.
            if (data.user?.twoFactorRequired) {
              if (data.refreshToken !== null) {
                throw new Error(
                  identifier + ' issued a refresh token while 2FA is still required — ' +
                  'that is the bypass the hardening exists to prevent: ' + text
                );
              }
              console.log('login ok (2FA pending, refresh token correctly withheld): ' + identifier);
              return;
            }

            if (!data.refreshToken) {
              throw new Error(identifier + ' completed login without 2FA but issued no refresh token: ' + text);
            }
            console.log('login ok: ' + identifier);
          }

          async function main() {
            for (const [identifier, password] of users) await login(identifier, password);
            console.log('All API logins validated');
          }

          main().catch((error) => {
            console.error(error);
            try {
              console.error('\n----- backend-smoke.log -----');
              console.error(fs.readFileSync('backend-smoke.log', 'utf8').slice(-12000));
              console.error('----- end backend-smoke.log -----\n');
            } catch {}
            process.exit(1);
          });
          NODE
          echo "::endgroup::"

      # The migration evidence the old health poll was reaching for, taken from the endpoint
      # that actually publishes it. This is the step that makes the job a release gate rather
      # than a liveness check: it fails the build on a pending or failed migration, and it
      # prints the applied/pending counts into the run summary so a release can cite them.
      - name: Assert migration health and record it as release evidence
        run: |
          echo "::group::Migration health"
          node - <<'NODE'
          const fs = require('node:fs');

          async function main() {
            // Same password the seeder wrote. The literal that used to be here belonged to the
            // same set of invented per-account passwords the login step above had, and 401'd
            // for the same reason.
            const loginRes = await fetch('http://localhost:5055/api/auth/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                identifier: 'admin@mascallnet.com',
                password: process.env.DEMO_AUTH_PASSWORD,
              }),
            });
            const loginText = await loginRes.text();
            if (!loginRes.ok) throw new Error('admin login failed: HTTP ' + loginRes.status + ' ' + loginText);
            const token = JSON.parse(loginText)?.data?.accessToken;
            if (!token) throw new Error('admin login returned no access token');

            const res = await fetch('http://localhost:5055/api/health/readiness', {
              headers: { Authorization: 'Bearer ' + token },
            });
            const text = await res.text();
            let json;
            try {
              json = JSON.parse(text);
            } catch {
              throw new Error('readiness returned non-JSON: HTTP ' + res.status + ' ' + text.slice(0, 400));
            }

            const m = json?.summary?.migrations ?? {};
            console.log(JSON.stringify(json, null, 2));

            const problems = [];
            if (m.status !== 'ok') problems.push('schema verification status is "' + m.status + '", expected "ok"');
            if ((m.pending_count ?? -1) !== 0) {
              problems.push(m.pending_count + ' pending migration(s): ' + JSON.stringify(m.pending_files ?? []));
            }
            if ((m.failed_count ?? -1) !== 0) {
              problems.push(m.failed_count + ' failed migration(s): ' + JSON.stringify(m.failed ?? []));
            }

            const summary = [
              '### Migration health',
              '',
              '| Field | Value |',
              '| --- | --- |',
              '| schema status | `' + m.status + '` |',
              '| applied | ' + m.applied_count + ' |',
              '| pending | ' + m.pending_count + ' |',
              '| failed | ' + m.failed_count + ' |',
              '| runner status | `' + m.runner_status + '` |',
              '',
            ].join('\n');
            if (process.env.GITHUB_STEP_SUMMARY) {
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + '\n');
            }

            if (problems.length) {
              console.error('Migration health check failed:');
              for (const p of problems) console.error('  - ' + p);
              process.exit(1);
            }
            console.log('Migrations clean: ' + m.applied_count + ' applied, 0 pending, 0 failed.');
          }

          main().catch((error) => {
            console.error(error);
            try {
              console.error('\n----- backend-smoke.log -----');
              console.error(fs.readFileSync('backend-smoke.log', 'utf8').slice(-12000));
              console.error('----- end backend-smoke.log -----\n');
            } catch {}
            process.exit(1);
          });
          NODE
          echo "::endgroup::"

      - name: Start frontend preview
        run: |
          npx vite preview > frontend-smoke.log 2>&1 &
          echo $! > frontend-smoke.pid

      - name: Wait for frontend
        run: |
          echo "::group::Frontend preview"
          node - <<'NODE'
          const fs = require('node:fs');
          const deadline = Date.now() + 90000;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function main() {
            let lastText = '';
            let attempt = 0;
            while (Date.now() < deadline) {
              attempt++;
              try {
                const res = await fetch('http://localhost:8080/');
                lastText = await res.text();
                if (res.ok) {
                  console.log('Frontend ready after ' + attempt + ' attempts');
                  return;
                }
                console.log('  attempt ' + attempt + ': HTTP ' + res.status);
              } catch (error) {
                lastText = error instanceof Error ? error.message : String(error);
                console.log('  attempt ' + attempt + ': ' + lastText);
              }
              await sleep(3000);
            }
            console.error('Frontend preview did not start within 90 s. Last error:');
            console.error(lastText);
            try {
              console.error('\n----- frontend-smoke.log -----');
              console.error(fs.readFileSync('frontend-smoke.log', 'utf8').slice(-8000));
              console.error('----- end frontend-smoke.log -----\n');
            } catch {}
            process.exit(1);
          }

          main();
          NODE
          echo "::endgroup::"

      # Scoped to the page-smoke project on purpose. playwright.config.ts also defines
      # 'journeys' (tests/e2e/*.spec.ts) — full candidate-onboarding flows that create data
      # and assume a populated database. Running them against a demo-seeded CI database
      # would make this gate red for reasons that have nothing to do with whether the build
      # renders, which is the failure mode that made the previous gate ignorable.
      #
      # This is a deliberate exclusion, not an oversight: 'journeys' still needs its own job
      # against a fixture-loaded database. Until that exists it does not run in CI, and the
      # line below says so in the log rather than leaving the omission silent.
      - name: Run Playwright page smoke
        run: |
          echo "::group::Playwright page smoke"
          echo "Running project 'page-smoke' only. Project 'journeys' is NOT covered by this gate."
          npx playwright test --config=playwright.config.ts --project=page-smoke
          echo "::endgroup::"

      # "Cannot add foreign key constraint" (errno 1215) names no constraint, no column and no
      # reason. InnoDB records the actual diagnosis — which constraint, which columns, and
      # whether it was a type, collation, index or engine mismatch — and discards it on the
      # next FK error. Reading it here turns a guessing game into one line.
      #
      # 409_visitor_management_foundation failed this way with eight foreign keys and no
      # indication which; every referenced table existed and every type matched on inspection.
      - name: InnoDB foreign key diagnosis
        if: failure()
        continue-on-error: true
        working-directory: backend
        run: |
          echo "::group::LATEST FOREIGN KEY ERROR"
          node -e "
          const mysql = require('mysql2/promise');
          (async () => {
            const conn = await mysql.createConnection({
              host: '127.0.0.1', port: 3306, user: 'root', password: 'rootpass', database: 'mas_hrms',
            });
            const [rows] = await conn.query('SHOW ENGINE INNODB STATUS');
            const status = rows?.[0]?.Status ?? '';
            const start = status.indexOf('LATEST FOREIGN KEY ERROR');
            if (start === -1) {
              console.log('No foreign key error recorded — this failure was not an FK problem.');
            } else {
              const end = status.indexOf('---------', start + 40);
              console.log(status.slice(start, end === -1 ? start + 4000 : end));
            }
            await conn.end();
          })().catch((e) => { console.error('could not read InnoDB status:', e.message); });
          "
          echo "::endgroup::"

      - name: Failure summary
        if: failure()
        run: |
          echo "## CI Failure Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -f backend-smoke.log ]; then
            echo "### Backend log (last 200 lines)" >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' '```' >> "$GITHUB_STEP_SUMMARY"
            tail -200 backend-smoke.log >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' '```' >> "$GITHUB_STEP_SUMMARY"
            echo "--- backend-smoke.log (last 200 lines) ---"
            tail -200 backend-smoke.log
          else
            echo "backend-smoke.log not found" >> "$GITHUB_STEP_SUMMARY"
            echo "backend-smoke.log not found"
          fi

          if [ -f frontend-smoke.log ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Frontend log (last 200 lines)" >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' '```' >> "$GITHUB_STEP_SUMMARY"
            tail -200 frontend-smoke.log >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' '```' >> "$GITHUB_STEP_SUMMARY"
            echo "--- frontend-smoke.log (last 200 lines) ---"
            tail -200 frontend-smoke.log
          fi

          if [ -d playwright-report ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### playwright-report contents" >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' '```' >> "$GITHUB_STEP_SUMMARY"
            ls -la playwright-report/ >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
            printf '%s\n' '```' >> "$GITHUB_STEP_SUMMARY"
            echo "--- playwright-report ---"
            ls -la playwright-report/ || true
          fi

          if [ -d test-results ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### test-results contents" >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' '```' >> "$GITHUB_STEP_SUMMARY"
            ls -la test-results/ >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
            printf '%s\n' '```' >> "$GITHUB_STEP_SUMMARY"
            echo "--- test-results ---"
            ls -la test-results/ || true
          fi

      - name: Upload smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: local-deployment-smoke-artifacts
          path: |
            backend-smoke.log
            frontend-smoke.log
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop backend and frontend
        if: always()
        run: |
          if [ -f backend-smoke.pid ]; then
            kill "$(cat backend-smoke.pid)" 2>/dev/null || true
          fi
          if [ -f frontend-smoke.pid ]; then
            kill "$(cat frontend-smoke.pid)" 2>/dev/null || true
          fi
