name: Performance Test Diagnostics

on:
  push:
    branches:
      - agent/performance-ingestion-platform

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  full-backend-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore complete ATS test and add missing write-access mock
        if: github.event_name == 'push'
        working-directory: .
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:backend/src/modules/ats/__tests__/ats.joiningDocumentsTracker.routes.test.ts > /tmp/ats-test.ts
          python - <<'PY'
          from pathlib import Path
          source = Path('/tmp/ats-test.ts').read_text()
          needle = """  },\n}));\n\nvi.mock('../../../middleware/requireRole.js'"""
          replacement = """  },\n  requireWriteAccess: (_req: express.Request, _res: express.Response, next: express.NextFunction) => next(),\n}));\n\nvi.mock('../../../middleware/requireRole.js'"""
          if needle not in source:
              raise SystemExit('Could not locate auth middleware mock insertion point')
          Path('backend/src/modules/ats/__tests__/ats.joiningDocumentsTracker.routes.test.ts').write_text(
              source.replace(needle, replacement, 1)
          )
          PY
          if git diff --quiet -- backend/src/modules/ats/__tests__/ats.joiningDocumentsTracker.routes.test.ts; then
            echo "ATS test file is already restored and patched."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add backend/src/modules/ats/__tests__/ats.joiningDocumentsTracker.routes.test.ts
            git commit -m "test(ats): preserve coverage and mock write guard"
            git push origin HEAD:agent/performance-ingestion-platform
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Run full backend test suite
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee ../performance-full-tests.log
          status=${PIPESTATUS[0]}
          echo "$status" > ../performance-full-tests.status
          exit 0
      - name: Extract failure summary
        if: always()
        working-directory: .
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          raw = Path('performance-full-tests.log').read_text(errors='replace') if Path('performance-full-tests.log').exists() else ''
          raw = re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', raw)
          pattern = re.compile(r'(Failed Tests|FAIL\s|AssertionError|Error:|Test Files|Tests\s|Duration|\u276f|expected|received|\.test\.ts|\.spec\.ts)', re.I)
          selected = [line[:1200] for line in raw.splitlines() if pattern.search(line)]
          Path('performance-full-tests-summary.log').write_text('\n'.join(selected[-180:]) or 'No concise failure lines found.')
          PY
      - name: Update validation diagnostic comment
        if: always()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          status=$(cat performance-full-tests.status 2>/dev/null || echo 1)
          {
            echo "<!-- performance-full-test-diagnostics -->"
            echo "### Full backend test suite"
            echo
            echo "Exit status: \`$status\`"
            echo
            echo '```text'
            cat performance-full-tests-summary.log 2>/dev/null || echo "No test summary was produced."
            echo '```'
          } > performance-full-test-comment.md
          gh api repos/${{ github.repository }}/issues/comments/5090546380 \
            --method PATCH \
            --field body="$(cat performance-full-test-comment.md)"
