name: Performance Test Diagnostics

on:
  push:
    branches:
      - agent/performance-ingestion-platform

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  full-backend-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Run full backend test suite
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee ../performance-full-tests.log
          status=${PIPESTATUS[0]}
          echo "$status" > ../performance-full-tests.status
          exit 0
      - name: Update validation diagnostic comment
        if: always()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          status=$(cat performance-full-tests.status 2>/dev/null || echo 1)
          {
            echo "<!-- performance-full-test-diagnostics -->"
            echo "### Full backend test suite"
            echo
            echo "Exit status: \`$status\`"
            echo
            echo '```text'
            tail -n 420 performance-full-tests.log 2>/dev/null || echo "No test log was produced."
            echo '```'
          } > performance-full-test-comment.md
          gh api repos/${{ github.repository }}/issues/comments/5090546380 \
            --method PATCH \
            --field body="$(cat performance-full-test-comment.md)"
