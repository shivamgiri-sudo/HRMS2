name: Performance Test Diagnostics

on:
  push:
    branches:
      - agent/performance-ingestion-platform

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  full-backend-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Run full backend test suite
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee ../performance-full-tests.log
          status=${PIPESTATUS[0]}
          echo "$status" > ../performance-full-tests.status
          exit 0
      - name: Extract failure summary
        if: always()
        working-directory: .
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          raw = Path('performance-full-tests.log').read_text(errors='replace') if Path('performance-full-tests.log').exists() else ''
          raw = re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', raw)
          pattern = re.compile(r'(Failed Tests|FAIL\s|AssertionError|Error:|Test Files|Tests\s|Duration|\u276f|expected|received|\.test\.ts|\.spec\.ts)', re.I)
          selected = [line[:1200] for line in raw.splitlines() if pattern.search(line)]
          Path('performance-full-tests-summary.log').write_text('\n'.join(selected[-180:]) or 'No concise failure lines found.')
          PY
      - name: Update validation diagnostic comment
        if: always()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          status=$(cat performance-full-tests.status 2>/dev/null || echo 1)
          {
            echo "<!-- performance-full-test-diagnostics -->"
            echo "### Full backend test suite"
            echo
            echo "Exit status: \`$status\`"
            echo
            echo '```text'
            cat performance-full-tests-summary.log 2>/dev/null || echo "No test summary was produced."
            echo '```'
          } > performance-full-test-comment.md
          gh api repos/${{ github.repository }}/issues/comments/5090546380 \
            --method PATCH \
            --field body="$(cat performance-full-test-comment.md)"
