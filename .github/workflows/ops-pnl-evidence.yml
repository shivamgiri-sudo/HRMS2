name: Ops P&L Reconciliation Evidence (manual, read-only)

# Per branch and month: HRMS P&L revenue / people cost vs db_bill invoices / salary. Writes nothing
# (HRMS SELECTs, billQuery SELECT-only). Its own workflow and concurrency group, so another session's
# ops-scripts dispatch cannot replace a pending run, and ops-scripts.yml stays under GitHub's
# expression-length limit.

on:
  workflow_dispatch:
    inputs:
      periods:
        description: "Space-separated YYYY-MM periods (blank = April 2026 up to last month)"
        required: false
        default: ""
      nonpeople:
        description: "Set to 'yes' to run the non-people (GRN / vendor) reconciliation instead (read-only)."
        required: false
        default: ""
      nkmove:
        description: "Set to 'dry-run' to print the Neelakanth-to-Jaldarshan cost-centre move and its before/after totals. This workflow never applies it."
        required: false
        default: ""
      nkrent:
        description: "Set to 'yes' to check Ahmedabad Neelakanth rent, db_bill vs HRMS (read-only)."
        required: false
        default: ""
      grnprobe:
        description: "Comma-separated GRN numbers to probe in the HRMS mirror (read-only)."
        required: false
        default: ""
      grncompare:
        description: "Voucher-level GRN comparison (read-only): 'YYYY-MM|BRANCH,YYYY-MM|BRANCH'"
        required: false
        default: ""
      livesalary:
        description: "Set to 'yes' to check that the running-month salary reaches Live P&L (read-only)."
        required: false
        default: ""
      branchplan:
        description: "Set to 'yes' to print the Hiring Engine branch plan as the API returns it (read-only)."
        required: false
        default: ""
      diag:
        description: "Set to 'yes' to print what each GRN source holds per month (read-only)."
        required: false
        default: ""
      trace:
        description: "People-cost trace (read-only, counts and totals only): 'YYYY-MM code1 code2 ...'. When set, runs the trace instead of the evidence."
        required: false
        default: ""

concurrency:
  group: ops-pnl-evidence-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  evidence:
    name: P&L reconciliation evidence
    runs-on: self-hosted
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install backend deps
        working-directory: backend
        run: npm ci
      - name: Run (read-only)
        working-directory: backend
        shell: bash
        env:
          DOTENV_CONFIG_PATH: /var/www/HRMS2/backend/.env
          NODE_ENV: production
          INPUT_PERIODS: ${{ inputs.periods }}
          INPUT_TRACE: ${{ inputs.trace }}
          INPUT_NONPEOPLE: ${{ inputs.nonpeople }}
          INPUT_DIAG: ${{ inputs.diag }}
          INPUT_BRANCHPLAN: ${{ inputs.branchplan }}
          INPUT_LIVESALARY: ${{ inputs.livesalary }}
          INPUT_GRNCOMPARE: ${{ inputs.grncompare }}
          INPUT_GRNPROBE: ${{ inputs.grnprobe }}
          INPUT_NKRENT: ${{ inputs.nkrent }}
          INPUT_NKMOVE: ${{ inputs.nkmove }}
        run: |
          set -euo pipefail
          if [ "$INPUT_NKMOVE" = "dry-run" ]; then
            npx tsx scripts/pnl-nk-branch-move.ts
          elif [ "$INPUT_NKRENT" = "yes" ]; then
            npx tsx scripts/pnl-nk-rent-check.ts
            npx tsx scripts/pnl-nk-rent-hrms.ts
          elif [ -n "$INPUT_GRNPROBE" ]; then
            npx tsx scripts/pnl-grn-mirror-probe.ts "$INPUT_GRNPROBE"
          elif [ -n "$INPUT_GRNCOMPARE" ]; then
            npx tsx scripts/pnl-grn-voucher-compare.ts "$INPUT_GRNCOMPARE"
          elif [ "$INPUT_LIVESALARY" = "yes" ]; then
            npx tsx scripts/pnl-live-salary-check.ts $INPUT_PERIODS
          elif [ "$INPUT_BRANCHPLAN" = "yes" ]; then
            npx tsx scripts/he-branch-plan-prod-check.ts
          elif [ "$INPUT_DIAG" = "yes" ]; then
            npx tsx scripts/pnl-grn-source-diag.ts
          elif [ "$INPUT_NONPEOPLE" = "yes" ]; then
            npx tsx scripts/pnl-nonpeople-recon-evidence.ts $INPUT_PERIODS
          elif [ -n "$INPUT_TRACE" ]; then
            # Quoted per word so codes containing '/' survive; read-only.
            read -r -a ARGS <<< "$INPUT_TRACE"
            npx tsx scripts/pnl-people-cost-cc-trace.ts "${ARGS[@]}"
          else
            npx tsx scripts/pnl-branch-recon-evidence.ts $INPUT_PERIODS
          fi
